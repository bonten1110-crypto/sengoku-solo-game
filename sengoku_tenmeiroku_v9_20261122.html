  const regen=Math.min(BATTLE_TROOPS-remaining,lg.politicsRegen+lg.recruitRegen);

  armies.push({id:t.id,before,loss,politics:lg.politics,politicsBase:lg.politicsBase,adept:lg.adept,politicsRegen:lg.politicsRegen,recruit:lg.recruit,recruitRegen:lg.recruitRegen,actualRegen:regen,after:t.army,alive:living(t).length,dead:t.dead.length});
 }
 m.result={winner,legs:[l1,l2],armies};advanceWinner(s.matches.indexOf(m),winner);save();
}
function pendingMatch(){return s.matches.find(x=>!x.result&&x.a!==null&&x.b!==null)}
// v6: play result-based, non-destructive battle cinematics. Resolution remains unchanged.
let battleCinematic=null;
function battleCinematicHtml(scene,step,total){
 const progress=Array.from({length:total},(_,i)=>`<span class="${i<step?'done':i===step?'current':''}"></span>`).join('');
 return `<div class="cutinFrame" role="document"><div class="cutinTop"><span>⚔ 戦国天命録　戦陣絵巻</span><span>${step+1} / ${total}</span></div><div class="cutinBody"><div class="battleKicker">${esc(scene.kicker)}</div><div class="battleTitle ${scene.titleClass||''}">${esc(scene.title)}</div>${scene.html||''}<div class="battleProgress">${progress}</div></div><div class="battleFoot"><button id="battleNext" type="button">▶ ${step===total-1?'結果を見る':'次へ'}</button><button id="battleSkip" type="button">⏭ 演出をスキップ</button></div></div>`;
}
function battleVS(nameA,nameB,labelA='攻撃軍',labelB='防衛軍',extraA='',extraB=''){
 return `<div class="battleVS"><div class="battleSide"><div class="battleSideLabel">${esc(labelA)}</div><div class="battleSideName">${esc(nameA)}</div>${extraA?`<div class="battleSideSmall">${esc(extraA)}</div>`:''}</div><div class="battleVsMark">VS</div><div class="battleSide enemy"><div class="battleSideLabel">${esc(labelB)}</div><div class="battleSideName">${esc(nameB)}</div>${extraB?`<div class="battleSideSmall">${esc(extraB)}</div>`:''}</div></div>`;
}
function battleTroopSummary(l){return `<div class="battlePowerRow"><span>攻撃：${fmt(l.attackerStart)}兵 → ${fmt(l.attackerAfter)}兵</span><span>防衛：${fmt(l.defenderStart)}兵 → ${l.win?'撤退':fmt(l.defenderAfter)+'兵'}</span></div>`}
function buildBattleScenes(m){
 const r=m.result, ta=s.teams[m.a],tb=s.teams[m.b],sc=[];
 sc.push({kicker:m.id+' · 開戦',title:'いざ、出陣！',duration:1300,html:battleVS(ta.name,tb.name,'東軍','西軍',`${fmt(r.armies?.find(x=>x.id===ta.id)?.before??ta.army)}兵`,`${fmt(r.armies?.find(x=>x.id===tb.id)?.before??tb.army)}兵`)+`<div class="battleEmblem">二戦を制し、天下へ駆け上がれ</div>`});
 if(r.forfeit){sc.push({kicker:'決着',title:'不戦勝',duration:2000,titleClass:'outcome',html:`<div class="battleSub">武将全滅のため試合は決着。</div><div class="battleVictory">🏆 ${esc(s.teams[r.winner].name)}</div>`});return sc}
 for(let i=0;i<r.legs.length;i++){
  const l=r.legs[i],an=s.teams[l.atk].name,dn=s.teams[l.def].name,sideLabel=`第${i+1}戦`;
  sc.push({kicker:sideLabel+' · 出陣',title:'両軍激突',duration:1400,html:battleVS(an,dn,'攻撃軍','防衛軍','総大将 '+l.commanderAttack,'総大将 '+l.commanderDefense)+`<div class="battleSub">天候：${esc(l.weather)}　${l.surprise?'⚡ 奇襲＋'+l.surprise+'%':'正面決戦'}</div>`});
  if(l.event){const e=l.event;sc.push({kicker:sideLabel+' · 戦場に異変',title:e.type,duration:1400,html:`<div class="battleSub">${esc(e.attackName)}　対　${esc(e.defenseName)}</div><div class="battleImpact">${esc(e.winner)}の策が決まる！</div><div class="battleEmblem">${esc(e.type)} 効果 ${e.rate}%</div>`})}
  const pct=Math.max(4,Math.min(96,100*l.atkPower/(l.atkPower+l.defPower)));
  sc.push({kicker:sideLabel+' · 勝敗判定',title:l.tier,titleClass:'outcome'+(l.tier==='惨敗'||l.tier==='敗北'?' bad':''),duration:2300,html:`<div class="battleOutcomeBanner">${l.win?'🏯 攻撃軍、占領成功':'🛡 防衛軍、守り切る'}</div><div class="battleSub">戦力 ${l.atkPower.toFixed(1)} 対 ${l.defPower.toFixed(1)} · 攻防比 ${(l.ratio*100).toFixed(1)}%</div><div class="battleMeter"><span style="width:${pct}%"></span><span style="width:${100-pct}%"></span></div>${battleTroopSummary(l)}<div class="battleImpact">${esc(l.win?an:dn)} が勝利！</div>`});
  const dead=l.deaths||[],resc=l.rescues||[];
  if(dead.length||resc.length){sc.push({kicker:sideLabel+' · 戦の代償',title:dead.length?'討死':'奇跡の生還',titleClass:dead.length?'bad':'',duration:1900,html:`${dead.map(d=>`<div class="battleDeath">💀 ${esc(s.teams[d.team].name)}・${esc(d.name)}（${esc(d.cause)}）</div>`).join('')}${resc.map(d=>`<div class="battleRescue">❤️ ${esc(s.teams[d.team].name)}・${esc(d.name)} が救出された！</div>`).join('')}<div class="battleSub">討死した武将は次戦から出陣できません</div>`})}
 }
 if(r.armies?.length){sc.push({kicker:'兵站報告 · 試合後',title:'戦陣補給',duration:1700,html:`${r.armies.map(a=>`<div class="battleSub">${esc(s.teams[a.id].name)}<br>${fmt(a.before)}兵 → <strong style="color:#7ee2c7">${fmt(a.after)}兵</strong>　（補給＋${fmt(a.actualRegen)}）</div>`).join('')}<div class="battleEmblem">政治力・能吏・募兵の効果を反映</div>`})}
 sc.push({kicker:m.id+' · 勝ち抜け',title:m.round===3?'天下統一！':'勝者、決す！',titleClass:'outcome',duration:2450,html:`<div class="battleVictory">🏆 ${esc(s.teams[r.winner].name)}</div><div class="battleSub">${m.round===3?'戦国天命録を制覇！':'次の戦いへ進軍する'}</div>`});
 return sc;
}
function battleNextScene(){
 const b=battleCinematic;if(!b)return;
 if(b.timer){clearTimeout(b.timer);b.timer=null}
 b.i++;
 if(b.i>=b.scenes.length){battleFinishCinematic();return}
 const scene=b.scenes[b.i],el=cutinLayer();el.className='cutinOverlay show battle';el.innerHTML=battleCinematicHtml(scene,b.i,b.scenes.length);
 $('battleNext').onclick=battleNextScene;$('battleSkip').onclick=battleFinishCinematic;
}
function battleFinishCinematic(){
 const b=battleCinematic;if(b?.timer)clearTimeout(b.timer);battleCinematic=null;hideCutinScreen();
}
function playBattleCinematic(m){battleFinishCinematic();battleCinematic={scenes:buildBattleScenes(m),i:-1,timer:null};battleNextScene()}
function nextMatch(){const m=pendingMatch();if(m){matchFight(m);render();playBattleCinematic(m)}}
function allMatches(){let k=0;while(pendingMatch()&&k++<8)matchFight(pendingMatch());save();render()}
function battleText(l){
 const a=s.teams[l.atk].name,d=s.teams[l.def].name;
 const e=l.event?`🎲 ${l.event.type}：${l.event.attackName} VS ${l.event.defenseName} → ${l.event.winner}が制す（効果${l.event.rate}%）${l.event.type==='伏兵'?`／軍師加点 攻+${l.event.adviseA} 守+${l.event.adviseD}`:''}`:'🎲 戦争イベントなし';
 const deaths=l.deaths?.length?l.deaths.map(x=>`💀 ${s.teams[x.team].name}の${x.name}が討死（${x.cause}）`).join('\n'):'💀 討死なし';
 const rescues=l.rescues?.length?'\n'+l.rescues.map(x=>`❤️ 人望の救出：${s.teams[x.team].name}の${x.name}が生還`).join('\n'):'';
 return `${a} 【攻撃】 vs 【防衛】 ${d}\n大将 ${l.commanderAttack} vs ${l.commanderDefense}\n統率/武力/知略/政治　攻 ${l.statAtk.map(Math.round).join('/')}　守 ${l.statDef.map(Math.round).join('/')}\n天候：${l.weather}　${l.surprise?'奇襲＋'+l.surprise+'%':''}\n${e}\n戦力 ${l.atkPower.toFixed(1)} vs ${l.defPower.toFixed(1)}　攻防比 ${(l.ratio*100).toFixed(1)}%\n${l.tier} / ${l.win?'攻撃軍が占領成功':'守備軍が防衛成功'}\n攻撃側 ${fmt(l.attackerStart)}兵 → ${fmt(l.attackerAfter)}兵（損失${fmt(l.attackerLoss)}）\n防御側 ${fmt(l.defenderStart)}兵 → ${l.win?'陥落判定（兵士は戦場から撤退）':fmt(l.defenderAfter)+'兵'}（実戦損失${fmt(l.defenderLoss)}）\n${deaths}${rescues}`;
}
function armyLine(r){return `${esc(s.teams[r.id].name)}：${fmt(r.before)}兵 − 損失${fmt(r.loss)} ＋ 政治補給${fmt(r.politicsRegen)}${r.adept?'（能吏＋50%）':''} ＋ 募兵${fmt(r.recruitRegen)} → <b>${fmt(r.after)}兵</b> ／ 生存 ${r.alive}人${r.dead?'・💀累計'+r.dead+'人':''}${r.actualRegen<r.politicsRegen+r.recruitRegen?'（兵力上限適用）':''}`}
function matchHTML(m){
 const a=m.a===null?'―':(s.teams[m.a].isCPU?'🤖 ':'👤 ')+esc(s.teams[m.a].name),b=m.b===null?'―':(s.teams[m.b].isCPU?'🤖 ':'👤 ')+esc(s.teams[m.b].name),w=m.result?.winner;
 return `<article class="match ${m.result?'done':''}"><div class="small muted">${m.id}${m.result?.bye?' · シード免除':''}</div><div class="vs"><span class="${w===m.a?'winner':''}"><b>${a}</b>${w===m.a?'🏆 WIN':''}</span><em>VS</em><span class="${w===m.b?'winner':''}"><b>${b}</b>${w===m.b?'🏆 WIN':''}</span></div>${m.result?m.result.bye?`<div class="result">${esc(s.teams[w].name)}は1回戦免除（兵力消耗・回復なし）</div>`:m.result.forfeit?`<div class="result">💀 武将全滅による不戦勝：<b>${esc(s.teams[w].name)}</b></div>`:`<div class="result">勝ち抜け：<b>${esc(s.teams[w].name)}</b><br><span class="score">攻防比 ${(m.result.legs[0].ratio*100).toFixed(1)}% / ${(m.result.legs[1].ratio*100).toFixed(1)}%</span><p class="small" style="line-height:1.8">${m.result.armies.map(armyLine).join('<br>')}</p>${m.result.legs.some(l=>l.deaths?.length)?`<div class="deathNotice">💀 討死：${m.result.legs.flatMap(l=>l.deaths||[]).map(x=>esc(s.teams[x.team].name+'・'+x.name)).join('、')}</div>`:''}${m.result.legs.some(l=>l.rescues?.length)?`<div class="rescueNotice">❤️ 人望による救出：${m.result.legs.flatMap(l=>l.rescues||[]).map(x=>esc(s.teams[x.team].name+'・'+x.name)).join('、')}</div>`:''}</div><details><summary>⚔️ 2戦の戦闘詳細・討死判定</summary><div class="details">${esc(m.result.legs.map(battleText).join('\n\n───────────────\n\n'))}</div></details>`:'<p class="small muted">対戦待ち</p>'}</article>`;
}
function teamStrength(t){const a=living(t),n=a.length?national(a):[0,0,0,0];return {leader:a.length?leader(a).name:'武将全滅',n,log:logistics(t),alive:a.length,dead:fallen(t)}}
function tournament(){const pending=pendingMatch(),champ=s.matches[6].result?.winner;
 $('app').innerHTML=`<div class="layout"><section class="box"><h2>🏟️ 戦国天命録・決勝トーナメント</h2><p class="small muted">👤 人間 ${s.teams.filter(t=>!t.isCPU).length}人 ／ 🤖 CPU ${s.teams.filter(t=>t.isCPU).length}人 ／ 1チーム${s.pickLimit}武将</p>
 <div class="order">各試合は攻守入替2戦・戦国十六国v8.5由来の戦闘式。攻防比と占領成績から勝ち抜けを判定します。<br>⚔️ 2戦の平均損失を次戦に引継ぎ。試合後は政治力×2、能吏＋50%、募兵1人＋500兵（上限10,000）。<br>💀 討死：通常1%、大敗5%。一騎討ち敗者5%・鬼将26%も個別判定。名将は討死率を30%軽減し、人望は発生した討死を50%で救出。<strong>討死武将の復帰・補充はなし</strong>。</div>
 <div class="row"><button class="primary" id="next" ${!pending?'disabled':''}>⚔️ ${pending?esc(pending.id)+'を戦う':'全試合終了'}</button><button id="all" ${!pending?'disabled':''}>全試合を進める（演出省略）</button><button id="reset" class="danger">新しい大会</button></div><p class="small muted">🎬 「戦う」で戦闘カットインが再生されます。各カットインは「次へ」を押すまで停止し、「演出をスキップ」で結果まで進めます。</p>
 ${champ!==undefined?`<div class="champ"><div>🎊 天下最強軍団 🎊</div><strong>${esc(s.teams[champ].name)}</strong><p>🏆 戦国天命録 制覇！</p></div>`:''}
 ${[1,2,3].map(r=>`<div class="stage">${r===1?'準々決勝':r===2?'準決勝':'決勝'}</div>${s.matches.filter(m=>m.round===r).map(matchHTML).join('')}`).join('')}</section>
 <aside class="box"><h2>👥 軍団・残存武将</h2>${s.teams.map((t,i)=>{const v=teamStrength(t),dead=new Set((t.dead||[]).map(x=>x.id));return `<details ${i===0?'open':''}><summary>${i+1}. ${t.isCPU?'🤖':'👤'} ${esc(t.name)}（${fmt(t.army)}兵 / 生存${v.alive}人）</summary><p class="small">大将：<b class="gold">${esc(v.leader)}</b><br>統/武/知/政：${v.n.map(x=>Math.round(x)).join(' / ')}<br><span class="hint">政治補給＋${fmt(v.log.politicsRegen)}兵${v.log.adept?'（能吏＋50%）':''} / 募兵${v.log.recruit}人＋${fmt(v.log.recruitRegen)}兵</span></p><div class="small muted">${t.picks.map(id=>{const o=officer(id);return `<span class="${dead.has(id)?'fallen':''}">${dead.has(id)?'💀 ':''}${esc(o.name)}${o.trait==='なし'?'':` <span class="tag">${esc(o.trait)}</span>`}</span>`}).join('　・　')}</div>${v.dead.length?`<p class="small" style="color:var(--red)">💀 討死：${v.dead.map(x=>esc(x.name+'（'+x.reason+'）')).join('、')}</p>`:''}</details>`}).join('')}</aside></div>`;
 $('next').onclick=nextMatch;$('all').onclick=allMatches;$('reset').onclick=reset;
}
function render(){if(!s)setup();else if(s.stage==='draft')draft();else tournament()}
if(load())render();else setup();

</script></body></html>
