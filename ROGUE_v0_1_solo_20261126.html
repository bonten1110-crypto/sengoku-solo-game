function pool(n,exclude=[]){let used=new Set([...g.armies.flatMap(a=>liveIds(a)),...(g.enemyIds||[]),...(g.bossSnapshot?.teams.flatMap(t=>t.ids)||[]),...exclude]);let a=g.all.filter(o=>!o.dead&&!used.has(o.id)&&!o.retired).map(o=>o.id);while(a.length<n)a.push(general());return shuf(a).slice(0,n)}
function newRun(){let time=+$('timeSelect').value,delay=+$('cpuSelect').value;g={version:1,stage:'initial',all:roster(),armies:[],serial:0,chapter:1,depth:0,match:0,wins:0,losses:0,eliteWins:0,time,delay,diff:3,prep:0,history:[],log:[],enemyUp:{},records:{},cumulative:{},chapterRecords:{},enemyIds:[],retry:false,cleared:0,started:Date.now(),cutin:'important',tasks:[],queue:[],units:[],traps:[],buildings:[],paused:false};for(let r of DAIMYO)if(!g.all.some(o=>o.name===r[0]))g.all.push({id:g.all.length,name:r[0],v:r.slice(1),t:weighted(),dead:false,boss:true});for(let p=0;p<4;p++)g.armies.push({p,ids:[],slots:[makeSlot(p,0),makeSlot(p,1)],up:{},gold:500,items:[],special:[],pending:[],person:p?pick(PERSONAL):'人間',last:''});for(let i=0;i<g.all.length/2;i++){if(i>=65)break;general()}g.offers=pool(3);renderInitial()}
function officerCard(id){let o=off(id),a=army(0);let bs=(BMAP.get(o.name)||[]).filter(b=>b.members.some(n=>liveIds(a).some(x=>off(x).name===n)&&n!==o.name));return `<strong>${esc(o.name)}</strong>${statHTML(o.v)}<div class="gold small">${esc(o.t)}｜計${total(o)}｜開花 ${bloomRate(o)*100}%</div>${bs.length?'<div class="small">🤝 '+bs.map(b=>esc(b.name)).join('・')+'</div>':''}`}
function cpuScore(a,id){let o=off(id),v=o.v,w={猛将型:[1,2,1,1],守将型:[2,1,1,1],軍師型:[1,1,2,1],内政型:[1,1,1,2],精鋭型:[1.2,1.2,1.2,1.2],大軍型:[1,1,1,1.5],万能型:[1,1,1,1]}[a.person]||[1,1,1,1];return v.reduce((n,x,i)=>n+x*w[i],0)+(o.t==='兵站'?30:o.t==='挟撃'?20:0)+(BMAP.get(o.name)||[]).filter(b=>b.members.some(n=>a.ids.some(x=>off(x).name===n))).length*12}
function cpuBest(a,ids){return ids.slice().sort((x,y)=>cpuScore(a,y)-cpuScore(a,x))[0]}
function setInitial(a,id,type){a.ids=[id];let u=a.slots[0];u.ids=[id];u.hp=2000;u.type=type;u.locked=true;a.last=off(id).name+' を獲得'}
function renderInitial(){g.stage='initial';save();$('app').innerHTML=`<div class="panel"><h2>初期武将を選ぶ</h2><label>初期兵種<select id="initialType">${TYPELIST.map(t=>`<option>${t}</option>`).join('')}</select></label><div class="grid">${g.offers.map(id=>`<button class="card" onclick="initialPick(${id})">${officerCard(id)}</button>`).join('')}</div></div>`}
function initialPick(id){if(g.stage!=='initial'||!g.offers.includes(id))return;setInitial(army(0),id,$('initialType').value);for(let p=1;p<4;p++){let a=army(p),x=cpuBest(a,pool(3));setInitial(a,x,bestType([x],p));pushlog(ownerName(p)+' '+a.last)}newChapter();showRoute()}
function bestType(ids,p){let u=makeSlot(p,0);u.ids=ids;return shuf(TYPELIST).sort((a,b)=>eff(u,b+'攻撃')+eff(u,b+'防御')-eff(u,a+'攻撃')-eff(u,a+'防御'))[0]}
function newChapter(){g.depth=0;g.retry=false;g.bossSnapshot=null;g.layers=makeLayers(rand(12,15));g.path=[];g.enemyIds=[];if(g.chapter>=8){let e=shuf(ENDENEMY).slice(0,rand(1,3));for(let x of e){if(x.op==='allstat')g.enemyStat=(g.enemyStat||0)+x.value;else g.enemyUp[x.op]=(g.enemyUp[x.op]||0)+x.value}pushlog('敵軍強化：'+e.map(x=>x.name).join('・'))}}
function makeLayers(n,retry=false){let ls=[];for(let i=0;i<n;i++){let forced=i===n-1?'boss':i===n-2?'rest':retry&&i===0?'recruit':!retry&&i===0?'normal':null;let count=forced?1:rand(2,4);let row=Array.from({length:count},()=>weightedPick({normal:28,elite:10,recruit:19,rest:14,merchant:9,event:15,special:5}));if(forced)row=[forced];if(!retry&&i===1)row[0]='recruit';if(!retry&&i===Math.floor(n/2))row[0]='recruit';if(!retry&&i===Math.floor(n/3))row[0]='rest';if(i<2)row=row.map(x=>x==='elite'?'normal':x);ls.push(row)}return ls}
function nextOptions(){let r=g.layers[g.depth]||[],streak=0;for(let k of g.path.slice().reverse()){if(!['normal','elite'].includes(k))break;streak++}if(streak>=3){r=r.map(k=>['normal','elite'].includes(k)?'rest':k);g.layers[g.depth]=r}return r}
function headerInfo(){return `<div class="row spread"><b class="gold">第${g.chapter}章${g.retry?'・再挑戦':''}　${g.depth}/${g.layers.length}地点</b><span class="small">勝${g.wins} / 敗${g.losses}　${fmt(army(0).gold)}金</span></div>`}
function teamSummary(){return `<div class="grid">${g.armies.map(a=>`<button class="card" onclick="armyView(${a.p})"><b>${ownerName(a.p)}　${a.person}</b><div>${fmt(totalHp(a))}兵 · ${liveIds(a).length}武将</div><div class="small">${active(a)?a.slots.filter(u=>u.hp>0).map(u=>esc(unitName(u))+' '+u.type).join('／'):'戦闘不能'}<br>${esc(a.last)}</div></button>`).join('')}</div>`}
function utilityBar(){return `<div class="row"><button onclick="armyView(0)">軍団・編成</button><button onclick="inventoryView()">名品 ${army(0).items.length}</button><button onclick="catalog()">図鑑</button><button onclick="settings()">設定</button></div>`}
function historyHTML(){return `<details><summary>遠征履歴</summary><div class="rlog">${g.history.map(x=>`<div>${esc(x)}</div>`).join('')}</div></details>`}
function showRoute(){if(!g.armies.some(active)){endRun(false,'全4軍団が戦闘不能');return}g.stage='route';g.enemyIds=g.retry?(g.bossSnapshot?.teams.flatMap(t=>t.ids.filter(id=>!off(id).dead))||[]):[];let r=nextOptions();save();$('app').innerHTML=`<div class="panel">${headerInfo()}<h2>進軍先を選択</h2><p class="small">現在地から3地点先まで公開。後戻り不可。</p><div class="sectionlabel">次の地点</div><div class="routegrid">${r.map((k,i)=>`<button class="${k}" onclick="enterNode(${i})">${LABEL[k]}</button>`).join('')}</div>${g.layers.slice(g.depth+1,g.depth+3).map((l,i)=>`<div class="sectionlabel">${i+2}地点先</div><div class="routegrid">${l.map(k=>`<span class="tag">${LABEL[k]}</span>`).join('')}</div>`).join('')}<p class="small">通過：${g.path.map(k=>LABEL[k]).join(' → ')||'出陣前'}</p>${utilityBar()}${historyHTML()}</div><div class="panel"><h3>味方4軍団</h3>${teamSummary()}${supportHTML()}</div>`}
function enterNode(i){if(g.stage!=='route')return;let k=nextOptions()[i];if(!k)return;g.node=k;g.depth++;g.path.push(k);g.stage='node';g.nodeLog=[];g.tasks=[];pushlog('第'+g.chapter+'章 '+g.depth+'地点：'+LABEL[k]);if(['normal','elite','boss'].includes(k)){prepareBattle(k);return}if(k==='recruit')nodeRecruit(5,1);if(k==='rest')nodeRest();if(k==='merchant')nodeMerchant();if(k==='event')nodeEvent();if(k==='special')nodeSpecial();renderNode()}
function nodeLog(s){g.nodeLog.push(s);pushlog(s)}
function grantOfficer(a,id,replace=null){if(!active(a)||off(id).dead||g.armies.some(b=>b.ids.includes(id)))return false;if(liveIds(a).length>=8){if(!a.ids.includes(replace))return false;let u=a.slots.find(u=>u.ids.includes(replace));if(u){u.ids=u.ids.map(x=>x===replace?id:x)}a.ids=a.ids.filter(x=>x!==replace);off(replace).retired=true}a.ids.push(id);let u=a.slots.find(u=>u.hp>0&&u.ids.length<4);if(u&&!a.slots.some(u=>u.ids.includes(id)))u.ids.push(id);a.last=off(id).name+' 登用';nodeLog(ownerName(a.p)+'：'+a.last);return true}
function cpuRecruit(a,offers){let id=cpuBest(a,offers);if(id==null)return;let ids=liveIds(a),worst=ids.slice().sort((x,y)=>cpuScore(a,x)-cpuScore(a,y))[0];if(ids.length<8||cpuScore(a,id)>cpuScore(a,worst))grantOfficer(a,id,worst)}
function nodeRecruit(n,count){let reservations=[];for(let a of g.armies){if(!active(a))continue;let opts=pool(n,reservations);reservations.push(...opts);if(a.p===0)g.tasks.push({kind:'recruit',offers:opts,left:count});else for(let i=0;i<count;i++){let id=cpuBest(a,opts);cpuRecruit(a,opts);opts=opts.filter(x=>x!==id)}}}
function upgradeStat(id,k,n){let o=off(id);if(!o||o.dead)return 0;let d=Math.max(0,Math.min(n,120-o.v[k]));o.v[k]+=d;return d}
function recruit(a,n){let add=0;for(let u of a.slots.filter(u=>u.hp>0&&u.ids.length).sort((x,y)=>x.hp/maxHp(x)-y.hp/maxHp(y))){let m=Math.min(maxHp(u)-u.hp,Math.floor(n*(1+bonus(u,'recruit_pct')/100)));m=Math.max(0,m);u.hp+=m;add+=m;n=Math.max(0,n-Math.ceil(m/(1+bonus(u,'recruit_pct')/100)))}return add}
function restFill(a,ratio=.4){let sum=0;for(let u of a.slots.filter(u=>u.hp>0&&u.ids.length)){let n=Math.min(maxHp(u)-u.hp,Math.floor(maxHp(u)*ratio*(1+bonus(u,'recruit_pct')/100)));u.hp+=n;sum+=n}return sum}
function chooseStat(a){let k=({猛将型:1,守将型:0,軍師型:2,内政型:3,大軍型:3})[a.person]??rand(0,3),ids=liveIds(a);return [ids.slice().sort((x,y)=>off(x).v[k]-off(y).v[k])[0],k]}
function nodeRest(){for(let a of g.armies){if(!active(a))continue;if(a.p===0)g.tasks.push({kind:'rest'});else{if(a.slots.some(u=>u.hp>0&&u.hp/maxHp(u)<.65)){nodeLog(ownerName(a.p)+'：休息 +'+restFill(a)+'兵')}else{let [id,k]=chooseStat(a);upgradeStat(id,k,5);nodeLog(ownerName(a.p)+'：'+off(id).name+' 鍛錬 '+ST[k])}cpuRetype(a)}}}
function cpuRetype(a){for(let u of a.slots.filter(u=>u.ids.length))u.type=bestType(u.ids,a.p)}
const GOODS=[['小規模募兵',200,'recruit',500],['大規模募兵',500,'recruit',1500],['武将鍛錬',300,'stat',5],['攻撃指南書',400,'attack_pct',5],['防御指南書',400,'defense_pct',5],['軍備拡張',350,'cap',500],['兵法指南',400,'stat',7],['兵站指南',500,'recruit_pct',10],['敏速指南',700,'move',1],['遠射指南',800,'range',1]];
function nodeMerchant(){for(let a of g.armies){let offers=shuf(GOODS.map((_,i)=>i)).slice(0,5);if(a.p===0){g.shop=offers;g.sold=[];continue}if(!active(a))continue;for(let i of offers.sort((x,y)=>(GOODS[y][2]==='recruit')-(GOODS[x][2]==='recruit'))){let [name,cost,op,v]=GOODS[i];if(a.gold<cost||a.gold-cost<100)continue;if(op==='recruit'&&a.slots.every(u=>!u.hp||u.hp>=maxHp(u)*.85))continue;a.gold-=cost;applyUpgrade(a,{name,op,value:v},null);nodeLog(ownerName(a.p)+'：'+name+' 購入')}cpuRetype(a)}g.tasks.push({kind:'merchant'})}
function itemDraw(poolType='any'){let weights=poolType==='rare_plus'?{R:25,E:9,L:1}:DATA.config.item_rarity_weights;let tier=weightedPick(weights);return pick(DATA.items.filter(i=>i.rarity===tier))}
function addItem(a,n=1,poolType='any'){for(let i=0;i<n;i++){let it=itemDraw(poolType);a.items.push(it.id);nodeLog(ownerName(a.p)+'：名品 '+it.name+' ['+it.rarity+'] 獲得')}}
function useItem(a,index,id){let it=ITEM[a.items[index]];if(!it||!liveIds(a).includes(id))return false;let n=it.effects.reduce((s,e)=>s+upgradeStat(id,ST.indexOf(e.stat),e.value),0);if(!n)return false;a.items.splice(index,1);pushlog(ownerName(a.p)+'：'+it.name+' → '+off(id).name);return true}
function cpuItems(a){if(!active(a))return;for(let i=a.items.length-1;i>=0;i--){let it=ITEM[a.items[i]],id=liveIds(a).sort((x,y)=>cpuScore(a,y)-cpuScore(a,x)).find(id=>it.effects.some(e=>off(id).v[ST.indexOf(e.stat)]<120));if(id!=null)useItem(a,i,id)}}
function eventDraw(scope){let kind=weightedPick(DATA.config.event_kind_weights);return pick(DATA.events.filter(e=>e.scope===scope&&e.kind===kind))}
function nodeEvent(){let scope=weightedPick(DATA.config.event_scope_weights);if(scope==='common'){let e=eventDraw(scope);g.tasks.push({kind:'event',event:e.id,ps:[0,1,2,3]})}else for(let a of g.armies){let e=eventDraw('individual');if(a.p===0)g.tasks.push({kind:'event',event:e.id,ps:[0]});else{let o=cpuEventChoice(e,[a.p]);applyEvent(e,o,[a.p])}}}
function eventValid(opt,ps){let r=opt.requires_each_affected_army;return !r||ps.every(p=>r.op==='gold'?army(p).gold>=r.value:r.op==='item'?army(p).items.length>=r.value:false)}
function cpuEventChoice(e,ps){let opts=e.options.map((o,i)=>({o,i})).filter(x=>eventValid(x.o,ps));return (opts.find(x=>x.o.outcomes.some(y=>y.effects.some(z=>['recruit','item','stat','gold','recruit_officer'].includes(z.op))))||opts[0])?.i??-1}
function forceBloom(o){let n=total(o),range=n<=249?[20,30]:n<=280?[15,20]:n<=310?[12,18]:n<=340?[10,16]:n<=370?[8,14]:n<=400?[6,12]:[3,5];return shuf([0,1,2,3].filter(k=>o.v[k]<120)).slice(0,2).map(k=>ST[k]+'+'+upgradeStat(o.id,k,rand(...range))).join('・')}
function applyEvent(e,ix,ps){let opt=e.options[ix];if(!opt||!eventValid(opt,ps))return;let z=Math.random()*100,r=opt.outcomes.find(o=>(z-=o.weight)<0)||opt.outcomes.at(-1);for(let p of ps){let a=army(p),req=opt.requires_each_affected_army;if(req?.op==='gold')a.gold-=req.value;if(req?.op==='item')a.items.shift();let id=p===0&&g.eventTarget!=null&&liveIds(a).includes(g.eventTarget)?g.eventTarget:cpuBest(a,liveIds(a));let results=[];for(let x of r.effects){if(x.op==='gold'){a.gold+=x.value;results.push('+'+x.value+'金')}else if(x.op==='gold_loss'){a.gold=Math.max(0,a.gold-x.value);results.push('-'+x.value+'金')}else if(x.op==='item')addItem(a,x.count,x.pool);else if(x.op==='item_consume_selected'){if(req?.op!=='item')a.items.shift()}else if(!active(a))continue;else if(x.op==='recruit')results.push('兵+'+recruit(a,x.value));else if(x.op==='loss_pct'){for(let u of a.slots.filter(u=>u.hp>0))u.hp=Math.max(1,u.hp-Math.floor(u.hp*x.value/100));results.push('兵損失 '+x.value+'%')}else if(x.op==='stat'||x.op==='stat_random'){let k=x.op==='stat'?ST.indexOf(x.stat):rand(0,3);results.push(off(id).name+' '+ST[k]+'+'+upgradeStat(id,k,x.value))}else if(x.op==='awaken')results.push(off(id).name+' 開花 '+forceBloom(off(id)));else if(x.op==='recruit_officer'){let opts=pool(x.candidates);if(p===0)g.tasks.push({kind:'recruit',offers:opts,left:x.count});else cpuRecruit(a,opts)}}nodeLog(ownerName(p)+'：'+e.name+' '+results.join('／'))}}
function nodeSpecial(){let s=weightedPick({treasure:20,train:20,bloom:15,hidden:15,full:15,tactic:15});nodeLog('特殊地点：'+({treasure:'秘宝殿',train:'修練場',bloom:'神社',hidden:'隠れ里',full:'大兵站拠点',tactic:'軍略道場'})[s]);if(s==='hidden'){nodeRecruit(10,2);return}for(let a of g.armies){if(s==='treasure')addItem(a,2,'rare_plus');else if(s==='tactic')giveReward(a,makeRewards('L'));else if(!active(a))continue;else if(s==='full')nodeLog(ownerName(a.p)+'：兵+'+restFill(a,1));else if(a.p===0)g.tasks.push({kind:s==='bloom'?'bloom':'train',value:15});else{let [id,k]=chooseStat(a);nodeLog(ownerName(a.p)+'：'+off(id).name+' '+(s==='bloom'?forceBloom(off(id)):ST[k]+'+'+upgradeStat(id,k,15)))}}}
const UPGRADE=[['統率鍛錬','stat',0],['武勇鍛錬','stat',1],['知略鍛錬','stat',2],['政治鍛錬','stat',3],['精鋭部隊','attack_pct'],['鉄壁部隊','defense_pct'],['臨時募兵','recruit'],['軍備拡張','cap'],['黄金獲得','gold'],['迅速行軍','move'],['遠射','range']];
const SPECIAL=[['天下の精鋭','attack_pct',10],['不落の陣','defense_pct',10],['百万石','gold_pct',30],['大兵站','recruit_pct',20],['九死一生','death_reduction_pct',50],['疾風迅雷','move',1],['大軍勢','cap',1000],['名将の采配','leadership_flat',5],['武神の加護','power_flat',5],['軍師の教え','intelligence_flat',5],['富国強兵','politics_flat',5],['軍馬の采配','speed_pct',10],['戦陣の備え','heal_pct',20],['天運','drop_pct',10],['千里の眼','range',1]];
const ENDREWARD=[['天下無双','attack_pct',8],['金城鉄壁','defense_pct',8],['百万の軍勢','cap',1000],['豊穣の国','recruit_pct',10],['黄金の天下','gold_pct',15],['天運','drop_pct',5],['神医の加護','death_reduction_pct',10]];
const ENDENEMY=[['大軍勢','cap',500],['大規模動員','initial_pct',5],['猛攻','attack_pct',5],['鉄壁','defense_pct',5],['名将の軍団','allstat',2],['神速','move',1],['長距離射撃','range',1],['強固な本陣','hq',500],['兵站強化','heal_pct',10]].map(([name,op,value])=>({name,op,value}));
function makeRewards(only=null){let weights=g.node==='elite'?{N:40,R:45,L:15}:g.node==='boss'?{R:70,L:30}:{N:70,R:25,L:5};let result=[];for(let i=0;i<3;i++){let tier=only||weightedPick(weights),v=({N:0,R:1,L:2})[tier],row=pick(UPGRADE.filter(x=>(v===2||!['move','range'].includes(x[1]))&&!result.some(y=>y.name===x[0])));let [name,op,k]=row;let val=({stat:[3,6,10],attack_pct:[3,6,10],defense_pct:[3,6,10],recruit:[300,600,1200],cap:[300,600,1000],gold:[100,250,500],move:[0,0,1],range:[0,0,1]})[op][v];result.push({name,op,k,value:val,tier})}return result}
function upgradeLabel(x){let label=({stat:x.k!=null?ST[x.k]:'任意能力',attack_pct:'攻撃',defense_pct:'防御',recruit:'補充兵',cap:'兵数上限',gold:'資金',move:'移動力',range:'最大射程',gold_pct:'獲得資金',recruit_pct:'兵士補充',death_reduction_pct:'討死率軽減',speed_pct:'速度',heal_pct:'戦闘回復',drop_pct:'ドロップ率',leadership_flat:'合成統率',power_flat:'合成武力',intelligence_flat:'合成知略',politics_flat:'合成政治'})[x.op]||x.op;return label+' +'+x.value+(x.op.endsWith('_pct')?'%':'')}
function chooseSlot(a){return a.slots.filter(u=>u.ids.length&&u.hp>0).sort((x,y)=>y.hp-x.hp)[0]||a.slots[0]}
function applyUpgrade(a,x,target){if(x.global){a.up[x.op]=(a.up[x.op]||0)+x.value;if(x.specialId)a.special.push(x.specialId);nodeLog(ownerName(a.p)+'：'+x.name+' 獲得');return}if(x.op==='gold'){a.gold+=x.value}else if(x.op==='recruit'){if(active(a))recruit(a,x.value);else a.pending.push(x)}else if(x.op==='stat'){let [id,k]=target||chooseStat(a);k=x.k??k;if(id==null){a.pending.push(x);return}upgradeStat(id,k,x.value)}else{let u=target!=null?a.slots[target]:chooseSlot(a);if(!u)u=a.slots[0];u.up[x.op]=(u.up[x.op]||0)+x.value}nodeLog(ownerName(a.p)+'：'+x.name+' 獲得')}

function transferPlan(target,includeHuman=false){let sources=g.armies.filter(a=>a.p!==target.p&&active(a)&&(a.p!==0||includeHuman));let giver=sources.find(a=>liveIds(a).length>=2&&a.slots.some(u=>u.hp>0&&u.ids.length>1));if(!giver)return null;let u=giver.slots.find(u=>u.hp>0&&u.ids.length>1),id=u.ids.at(-1),remaining=1000,parts=[];for(let a of sources){let available=Math.max(0,totalHp(a)-2000);for(let s of a.slots.filter(s=>s.hp>1)){let n=Math.min(available,s.hp-1,remaining);if(n>0){parts.push({p:a.p,j:a.slots.indexOf(s),n});remaining-=n;available-=n}if(!remaining)break}if(!remaining)break}return remaining?null:{giver:giver.p,id,parts}}

function makeMap(){let tiles=Array(168).fill('plain'),pair=(i,t)=>{tiles[i]=tiles[167-i]=t};let theme=pick(['平原','山岳','深林','河川','湿原','混合']);g.theme=theme;let h=rand(2,9),f=72+rand(2,9);pair(h,'hq');pair(f,'fort');let n=({平原:[4,3,2,2],山岳:[7,18,3,2],深林:[23,5,4,2],河川:[5,5,15,4],湿原:[6,4,4,19],混合:[12,9,6,6]})[theme];for(let [j,t] of ['forest','mountain','river','wet'].entries()){let free=shuf(Array.from({length:84},(_,i)=>i).filter(i=>tiles[i]==='plain'));free.slice(0,n[j]).forEach(i=>pair(i,t))}let river=shuf(Array.from({length:84},(_,i)=>i).filter(i=>tiles[i]==='river'));river.slice(0,Math.ceil(river.length/3)).forEach(i=>pair(i,'bridge'));g.tiles=tiles;let hp=2500+(g.enemyUp.hq||0);g.buildings=[{pos:h,kind:'hq',side:0,hp:2500,max:2500},{pos:167-h,kind:'hq',side:1,hp,max:hp},{pos:f,kind:'fort',side:null,hp:1000,max:1000},{pos:167-f,kind:'fort',side:null,hp:1000,max:1000}];g.traps=[]}

function prepareBattle(k){g.stage='formation';g.match++;g.turn=0;g.turnLimit=({normal:20,elite:25,boss:30})[k];g.log=[];g.records={};g.recordDone=false;g.queue=[];g.qi=0;g.inspect=null;g.action=null;g.notices=[];g.weather=weightedPick({晴天:50,曇天:20,雨:15,豪雨:5,霧:10});makeMap();for(let a of g.armies.slice(1))cpuReform(a);g.units=g.armies.flatMap(a=>a.slots.map(u=>({...clone(u),pos:null,out:false,def:false,retreat:false,buffs:{}})));g.teams=g.armies.map(a=>({p:a.p,ids:a.ids.slice()}));if(k==='boss'&&g.retry&&g.bossSnapshot){let snap=g.bossSnapshot;g.enemyIds=snap.teams.flatMap(t=>t.ids.filter(id=>!off(id).dead));g.teams.push(...clone(snap.teams));for(let u of clone(snap.units)){u.pos=null;u.out=false;u.def=false;u.retreat=false;u.buffs={};if(u.hp>0&&u.ids.length)u.hp=Math.min(maxHp(u),u.hp+Math.floor(maxHp(u)*.5));g.units.push(u)}}else{g.enemyIds=[];let ch=Math.min(7,g.chapter)-1,b=({normal:0,elite:2,boss:4})[k],hp=BASEHP[ch].slice(b,b+2),ds=DEPUTIES[ch].slice(b,b+2),cnt=Math.min(8,4+Math.floor(ch/2)+(k==='normal'?0:k==='elite'?1:2));if(g.chapter>=8)cnt=8;let bossId=null;if(k==='boss'){let available=g.all.filter(o=>DAIMYO.some(r=>r[0]===o.name)&&!o.dead&&!o.retired&&!g.armies.some(a=>a.ids.includes(o.id)));bossId=pick(available)?.id??null;if(bossId!=null)g.enemyIds.push(bossId);g.bossName=bossId!=null?off(bossId).name:'乱世の覇者'}for(let j=0;j<cnt;j++){let p=4+Math.floor(j/2),u=makeSlot(p,j%2);let ids=j===0&&bossId!=null?[bossId]:[];let n=1+rand(...ds);ids.push(...pool(n-ids.length));g.enemyIds.push(...ids);u.ids=ids;u.type=bestType(ids,p);if(j%4!==0&&!ids.some(id=>off(id).t.includes('攻撃')||off(id).t.includes('防御')))u.type=TYPELIST[j%4];if(g.chapter>=8&&g.enemyStat)for(let id of ids){let o=off(id),d=Math.max(0,g.enemyStat-(o.enemyStatApplied||0));o.v=o.v.map(v=>Math.min(120,v+d));o.enemyStatApplied=g.enemyStat}let num=Math.round(rand(...hp)*(1+(g.enemyUp.initial_pct||0)/100));u.up.cap=Math.max(0,num-maxHp(u));u.hp=num;g.units.push(u);let t=g.teams.find(t=>t.p===p);if(t)t.ids.push(...ids);else g.teams.push({p,ids:ids.slice()})}}g.budget=totalHp(army(0));formScreen()}

function formScreen(){g.stage='formation';save();$('app').innerHTML=`<div class="panel">${headerInfo()}<h2>${LABEL[g.node]} ${g.node==='boss'?esc(g.bossName||'章ボス'):''}</h2><p>戦場：${g.theme} ／ 天候：${g.weather} ／ ${g.turnLimit}ターン</p>${mapHTML()}${terrainLegend()}<button class="wide" onclick="armyView(0)" ${active(army(0))?'':'disabled'}>自軍の武将・兵数編成</button><button class="wide" onclick="inventoryView()">名品使用</button><button class="primary wide" onclick="toDeploy()">初期配置へ</button></div><div class="panel"><h3>敵軍（戦術・絆・強化は開戦まで非公開）</h3>${g.units.filter(u=>u.side===1&&u.ids.length).map(u=>`<div class="listrow"><b>${esc(unitName(u))}隊 ${u.type} ${u.hp}兵</b>${u.ids.map(id=>`<div class="small">${esc(off(id).name)} ${off(id).v.join('/')}</div>`).join('')}</div>`).join('')}</div>`}
function deployCells(s){return Array.from({length:24},(_,i)=>s===0?i:144+i)}
function autoDeploy(s){let us=g.units.filter(u=>u.side===s&&alive(u)),h=g.buildings.find(b=>b.side===s&&b.kind==='hq').pos;let cells=deployCells(s).filter(i=>i!==h);let def=us.find(u=>u.type==='足軽')||us[0];if(def)def.pos=h;for(let u of us.filter(u=>u!==def)){cells.sort((a,b)=>{let v=i=>(s===0?pos(i)[0]:13-pos(i)[0])*20+(g.tiles[i]==='mountain'&&['弓兵','鉄砲'].includes(u.type)?30:0)-dist(i,h);return v(b)-v(a)});u.pos=cells.shift()}}

function deployRender(){save();$('app').innerHTML=`<div class="panel" id="deployMapPanel"><h2>初期配置・戦術設置</h2><p class="small">自軍は上2行、罠は上6行。青枠・黄枠から選択。未設置でも開戦可能。</p><div class="row">${g.units.filter(u=>u.p===0&&alive(u)).map(u=>`<button class="${g.deployUnit===u.id?'active':''}" onclick="selectDeploy(${u.id})">${esc(unitName(u))}</button>`).join('')}<button onclick="autoTrapFor(0);deployRender()">罠自動設置</button></div>${mapHTML()}<div class="row">${trapHolders(0).map(o=>`<button class="${g.deployTrap===o.id?'active':''}" onclick="selectTrap(${o.id})">${esc(o.name)} ${o.t}${g.traps.some(t=>t.id===o.id)?' ✓':''}</button>`).join('')}</div><p>${esc(g.deployMsg||'')}</p><button class="primary wide" onclick="startBattle()">開戦する</button></div>`}
function tileClick(i){g.inspect=i;if(g.stage==='formation'){formScreen();return}if(g.stage==='deploy'){let z=at(i);if(g.deployTrap!=null){let o=off(g.deployTrap);if(trapLegal(o.t,i,0,o.id)){g.traps=g.traps.filter(t=>t.id!==o.id);putTrap(o,0,i);g.deployTrap=null}}else if(z?.p===0){if(g.deployUnit!=null&&g.deployUnit!==z.id){let u=g.units.find(x=>x.id===g.deployUnit);[u.pos,z.pos]=[z.pos,u.pos];g.deployUnit=null}else g.deployUnit=z.id}else if(g.deployUnit!=null&&i<24&&!z){g.units.find(x=>x.id===g.deployUnit).pos=i;g.deployUnit=null}deployRender();return}if(g.stage!=='battle'||modalOpen)return;let u=current(),a=g.action;if(u?.p===0&&alive(u)){if(a.mode==='move'&&!a.moved&&!a.attacked&&i!==u.pos&&reachable(u).has(i)){a.selected=i;a.path=reachable(u).get(i).path}else if(a.mode==='attack'&&!a.attacked&&attackTargets(u).some(t=>t.pos===i)){a.selected=i}}renderBattle()}
function routeArrow(j){let p=g.action.path,from=j?p[j-1]:current().pos;return ARROW[direction(from,p[j])]}
function executeSelection(){let u=current(),a=g.action,i=a.selected;if(u?.p!==0||i==null||modalOpen)return;if(a.mode==='move'){doMove(u,i);if(g.stage==='battle'&&current()===u){a.mode='attack';a.selected=null;a.path=[];renderBattle()}}else if(a.mode==='attack'){let t=attackTargets(u).find(t=>t.pos===i);if(t){doAttack(u,t);if(g.stage==='battle'&&current()===u){a.selected=null;a.mode='face';renderBattle()}}}}
function damageRange(u,t){if(!t.u){let b=t.b;let n=u.hp*.12*(attackAbility(u)/100)*TYPES[u.type].siege*attackModifiers(u)*(b.kind==='hq'?[1,1.10,1.20][fortCount(u.side)]:1);return [.9,1.1].map(f=>Math.min(b.hp,Math.max(1,Math.round(n*f))))}let z=t.u,k=directionKind(u,z),d=k==='正面'?[0,0]:k==='側面'?[.1,.15]:[.2,.3],f=flank(u,z)?.70*best(u,'挟撃'):0,m=matchup(u.type,z.type),mm=m===1?[1.15,1.25]:m===-1?[.75,.85]:[1,1],guard=z.def?(k==='正面'?[.60,.70]:k==='側面'?[.80,.85]:[1,1]):[1,1],n=.12*Math.sqrt(u.hp*z.hp)*attackAbility(u)/Math.max(1,defenseAbility(z))*TYPES[u.type].atk/TYPES[z.type].def*attackModifiers(u,k)/defModifiers(z)*(1-smoke(u,z));return [0,1].map(i=>Math.min(z.hp,Math.max(1,Math.round(n*mm[i]*(1+Math.max(d[i],f))*guard[i]*[.9,1.1][i]))))}
function renderBattle(){if(g.stage!=='battle')return;save();let u=current(),mine=u?.p===0&&alive(u)&&!modalOpen&&!g.paused,a=g.action||{},z=at(g.inspect),ha=g.buildings.find(b=>b.kind==='hq'&&b.side===0),hb=g.buildings.find(b=>b.kind==='hq'&&b.side===1),target=mine&&a.mode==='attack'?attackTargets(u).find(t=>t.pos===a.selected):null,est=target?(target.u?damageEstimate(u,target.u):siegeDamage(u,target.b)):0;let bounds=target?damageRange(u,target):null,range=bounds?bounds.join('〜'):'';$('app').innerHTML=`<div class="layout"><div class="panel"><div class="statusbar"><div class="blue">青本陣<strong>${ha.hp}/${ha.max}</strong>砦 ${fortCount(0)}</div><div><b class="gold">TURN ${g.turn}/${g.turnLimit}</b><strong id="clock">--</strong><span class="small">${g.theme}・${g.weather}</span></div><div class="red">赤本陣<strong>${hb.hp}/${hb.max}</strong>砦 ${fortCount(1)}</div></div><div class="order">${g.queue.map((id,j)=>{let x=g.units.find(u=>u.id===id);return `<span class="${x.side?'enemy':''} ${j===g.qi?'now':''} ${j<g.qi||!alive(x)?'past':''}">${j+1} ${esc(unitName(x).slice(0,4))} ${!alive(x)?(x.hp?'退':'壊'):j<g.qi?'済':j===g.qi?'中':'待'}</span>`}).join('')}</div>${mapHTML('battle')}${mine&&a.selected!=null?`<div class="panel"><b>${a.mode==='attack'?'予想損害 '+range+(target?.u?'｜'+directionKind(u,target.u)+'｜相性 '+(['不利','互角','有利'][matchup(u.type,target.u.type)+1])+'｜討死 '+(bounds[0]>=target.u.hp?'壊滅時 各'+Math.round(20*deathFactor(target.u)*100)/100+'%':([.5,1,2][['正面','側面','背面'].indexOf(directionKind(u,target.u))]*deathFactor(target.u)).toFixed(2)+'%（生存時）'):''):'移動先 '+pos(a.selected).map(x=>x+1).join(',')}</b><button class="primary wide" onclick="executeSelection()">${a.mode==='attack'?'攻撃':'移動'}確定</button></div>`:''}<div class="actions"><button ${mine&&!a.moved&&!a.attacked?'':'disabled'} class="${a.mode==='move'?'active':''}" onclick="selectMode('move')">移動</button><button ${mine&&!a.attacked?'':'disabled'} class="${a.mode==='attack'?'active':''}" onclick="selectMode('attack')">攻撃</button function selectMode(m){let u=current();if(u?.p!==0||modalOpen)return;g.action.selected=null;setMode(m)}

function finish(s,reason){if(g.stage!=='battle')return;clearTimeout(cpuTimer);resumeId++;deadline=0;modalOpen=false;$('modal').classList.add('hidden');g.winner=s;g.reason=reason;g.nodeLog=[];g.tasks=[];g.rewardBattle=g.node;g.stage='reward';let blooms=[];for(let u of g.units){if(u.deployed){growUnit(u,3);for(let id of u.ids){let b=awaken(off(id));if(b)blooms.push(b)}}}snapshotRecordStatus();finalizeRecords();for(let v of Object.values(g.records)){let a=g.chapterRecords[v.id]||(g.chapterRecords[v.id]={id:v.id,p:v.p});for(let k of METRICS)a[k]=(a[k]||0)+(v[k]||0)}for(let a of g.armies){a.ids=liveIds(a);a.slots=a.slots.map(old=>{let u=g.units.find(u=>u.id===old.id);if(!u)return old;return {...clone(old),ids:u.ids.filter(id=>!off(id).dead),hp:u.ids.length?u.hp:0,type:u.type,pos:null,out:false,def:false,retreat:false,buffs:{}}})}if(g.node==='boss'&&s!==0&&!g.retry)g.bossSnapshot={units:clone(g.units.filter(u=>u.side===1)),teams:clone(g.teams.filter(t=>t.p>=4))};nodeLog((s===0?'勝利！':'敗北：')+reason);for(let b of blooms)nodeLog(b);if(s===0){g.wins++;if(g.node==='elite')g.eliteWins++;for(let a of g.armies){let reward=({normal:[200,300],elite:[400,600],boss:[800,1000]})[g.node],politics=Math.max(0,...liveIds(a).map(id=>off(id).v[3])),pct=Math.max(0,Math.floor((politics-50)/10)*5)+(a.up.gold_pct||0)+a.slots.reduce((n,u)=>n+bondVal(u,'gold_pct'),0);let gold=Math.floor(rand(...reward)*(1+.1*(g.chapter-1))*(1+pct/100));a.gold+=gold;nodeLog(ownerName(a.p)+' '+gold+'金');giveReward(a,makeRewards());let d=DATA.config.item_drop[g.node];if(Math.random()*100<Math.min(100,d.chance+(a.up.drop_pct||0)))addItem(a,rand(...d.count));if(g.node==='boss')giveReward(a,specialRewards(a))}}else g.losses++;cpuSupport();g.enemyIds=g.node==='boss'&&s!==0&&!g.retry?g.bossSnapshot.teams.flatMap(t=>t.ids.filter(id=>!off(id).dead)):[];renderNode()}

const originalShowHelp=showHelp, originalCloseHelp=closeHelp;showHelp=function(kind,title,html){if(modalOpen)return;clearTimeout(cpuTimer);resumeId++;originalShowHelp(kind,title,html)};closeHelp=function(){let was=helpKind,elapsed=Date.now()-helpSince;originalCloseHelp();if(!was)return;if(g?.stage==='battle'){if(was!=='guide'&&deadline)deadline+=elapsed;if(current()?.p!==0)scheduleCPU();renderBattle()}else if(g)rerender()};

interval=setInterval(tick,250);if(!loadGame())setup();
