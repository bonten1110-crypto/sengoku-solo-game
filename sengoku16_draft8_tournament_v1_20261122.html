function powerTrait(c,name,base,second,third){return countTrait(c,name)?1+(base+bonus(c,name,second,third))/100:1}
function leader(c){return c.slice().sort((a,b)=>(b.v[0]*4+b.v[2]*3+b.v[1]*2)-(a.v[0]*4+a.v[2]*3+a.v[1]*2)||b.v.reduce((x,y)=>x+y,0)-a.v.reduce((x,y)=>x+y,0))[0]}
function national(c){const lord=leader(c),extras=[0,0,0,0];for(const o of c){if(o===lord)continue;for(let i=0;i<4;i++)extras[i]+=o.v[i]}return lord.v.map((x,i)=>{let v=x+Math.ceil(extras[i]/7.5);return i===1&&countTrait(c,'鬼将')?v*powerTrait(c,'鬼将',5,1,1):i===2&&countTrait(c,'鬼謀')?v*powerTrait(c,'鬼謀',10,1,1):v})}
function basicAttackPower(sent,stats){return sent/70+stats[1]*.35+stats[0]*.25+stats[2]*.20}
function basicDefensePower(troops,stats){return troops/70+stats[0]*.40+stats[2]*.30+stats[1]*.10}
function combatTier(ratio){if(ratio>=1.20)return {name:'大勝',a:[5,18],d:null,major:true};if(ratio>=1.10)return{name:'辛勝',a:[15,30],d:null,major:false};if(ratio>=1.05)return{name:'優勢',a:[20,35],d:[25,40],major:false};if(ratio>=.95)return{name:'接戦',a:[10,30],d:[15,30],major:false};if(ratio>=.90)return{name:'惜敗',a:[15,35],d:[10,25],major:false};if(ratio>=.75)return{name:'敗北',a:[20,40],d:[5,18],major:false};return{name:'惨敗',a:[30,55],d:[3,13],major:true}}
function combatLossV46(own,enemy,minRate,rolledRate,defeatBonus=0){own=Math.max(0,Math.floor(own));enemy=Math.max(0,Math.floor(enemy));if(!own)return 0;const matched=Math.min(own,enemy);let loss=((own+matched)/2)*minRate/100+(.20*own+.80*matched)*(rolledRate-minRate)/100;if(own>enemy)loss*=.55+.45*enemy/own;else if(own<enemy&&defeatBonus>0)loss*=1+(1-own/Math.max(1,enemy))*defeatBonus;return Math.min(own,Math.ceil(loss))}
const v46DefeatBoost={大勝:0,辛勝:0,優勢:0,接戦:.05,惜敗:.20,敗北:.35,惨敗:.50};
function duelRepresentative(c,i){const highest=Math.max(...c.map(o=>o.v[i]));return choose(c.filter(o=>o.v[i]===highest))}
function rollWarEvent(a,d){const roll=rand(1,200),type=roll<=25?'一騎討ち':roll<=50?'伏兵':roll<=75?'兵站支援':roll<=100?'士気高揚':null;if(!type||!a.length||!d.length)return null;const index=type==='一騎討ち'?1:type==='伏兵'?2:type==='兵站支援'?3:0,ao=duelRepresentative(a,index),doo=duelRepresentative(d,index),as=ao.v[index]+rand(-10,10),ds=doo.v[index]+rand(-10,10),aWon=as===ds?rand(0,1)===0:as>ds,rate=type==='一騎討ち'?rand(5,10):type==='伏兵'?rand(6,14):type==='兵站支援'?rand(20,40):rand(10,15);return{type,attacker:ao,defender:doo,attackerScore:as,defenderScore:ds,aWon,winner:aWon?ao:doo,loser:aWon?doo:ao,rate}}
function leg(atkTeam,defTeam){const a=atkTeam.picks.map(officer),d=defTeam.picks.map(officer),an=national(a),dn=national(d),weather=choose([0,-.05,-.10,-.15]),event=rollWarEvent(a,d);let sent=BATTLE_TROOPS,dt=BATTLE_TROOPS,ambushAttackLoss=0,ambushDefenseLoss=0;
if(event?.type==='伏兵'){if(event.aWon){ambushDefenseLoss=Math.floor(dt*event.rate/100);dt-=ambushDefenseLoss}else{ambushAttackLoss=Math.floor(sent*event.rate/100);sent-=ambushAttackLoss}}
const pBonus=event?.type==='士気高揚'?5:event?.type==='一騎討ち'?event.rate:0,attackEvent=event?.aWon?1+pBonus/100:1,defenseEvent=event&&!event.aWon?1+pBonus/100:1;
const surprise=countTrait(a,'奇襲')&&Math.random()<(20+bonus(a,'奇襲',3,2))/100?rand(10,15):0;
const atk=basicAttackPower(sent,an)*(1+weather)*(countTrait(a,'猛将')?1+(rand(5,10)+bonus(a,'猛将',2,1))/100:1)*powerTrait(a,'鬼将',5,0,0)*(surprise?1+surprise/100:1)*powerTrait(a,'名将',3,2,1)*attackEvent*rand(90,110)/100;
const def=basicDefensePower(dt,dn)*(countTrait(d,'守将')?1+(rand(5,10)+bonus(d,'守将',2,1))/100:1)*powerTrait(d,'築城',7.5,2,1)*powerTrait(d,'名将',3,2,1)*defenseEvent*rand(90,110)/100;
const ratio=atk/Math.max(1,def),win=ratio>=1.10,tier=combatTier(ratio),rateA=rand(tier.a[0],tier.a[1]),rateD=tier.d?rand(tier.d[0],tier.d[1]):null;
let casualtiesA=combatLossV46(sent,dt,tier.a[0],rateA,win?0:v46DefeatBoost[tier.name]),casualtiesD=rateD===null?0:combatLossV46(dt,sent,tier.d[0],rateD,0);
if(event?.type==='兵站支援'){if(event.aWon)casualtiesA=Math.max(0,Math.ceil(casualtiesA*(100-event.rate)/100));else if(!win)casualtiesD=Math.max(0,Math.ceil(casualtiesD*(100-event.rate)/100))}
if(event?.type==='士気高揚'){if(event.aWon)casualtiesD=Math.min(dt,Math.ceil(casualtiesD*(100+event.rate)/100));else casualtiesA=Math.min(sent,Math.ceil(casualtiesA*(100+event.rate)/100))}
const survivors=Math.max(0,sent-casualtiesA),defenderAfter=win?0:Math.max(0,dt-casualtiesD);
return {atk:atkTeam.id,def:defTeam.id,weather:['晴','曇','雨','豪雨'][[0,-.05,-.10,-.15].indexOf(weather)],ratio,win,tier:tier.name,surprise,event:event?{type:event.type,attackName:event.attacker.name,defenseName:event.defender.name,winner:event.winner.name,aWon:event.aWon,rate:event.rate}:null,attackerStart:BATTLE_TROOPS,defenderStart:BATTLE_TROOPS,attackerAfter:survivors,defenderAfter,attackerLoss:BATTLE_TROOPS-survivors,defenderLoss:BATTLE_TROOPS-defenderAfter,statAtk:an,statDef:dn,atkPower:atk,defPower:def,commanderAttack:leader(a).name,commanderDefense:leader(d).name}}
function matchFight(m){const ta=s.teams[m.a],tb=s.teams[m.b];const l1=leg(ta,tb),l2=leg(tb,ta);let winner;if(l1.win&&!l2.win)winner=m.a;else if(l2.win&&!l1.win)winner=m.b;else winner=(l1.ratio===l2.ratio?choose([m.a,m.b]):l1.ratio>l2.ratio?m.a:m.b);
m.result={winner,legs:[l1,l2]};const pos=s.matches.indexOf(m);if(pos<4){s.matches[4+Math.floor(pos/2)][pos%2?'b':'a']=winner}else if(pos<6){s.matches[6][pos%2?'b':'a']=winner}save()}
function nextMatch(){const m=s.matches.find(m=>m.result===null&&m.a!==null&&m.b!==null);if(m){matchFight(m);render()}}
function allMatches(){while(s.matches.some(m=>m.result===null))nextMatch();render()}
function battleText(l){const a=s.teams[l.atk].name,d=s.teams[l.def].name;const e=l.event?`🎲 ${l.event.type}：${l.event.attackName} VS ${l.event.defenseName} → ${l.event.winner}が制す（効果${l.event.rate}%）`:'🎲 戦争イベントなし';return `${a} 【攻撃】 vs 【防衛】 ${d}\n大将 ${l.commanderAttack} vs ${l.commanderDefense}\n統率/武力/知略/政治　攻 ${l.statAtk.map(Math.round).join('/')}　守 ${l.statDef.map(Math.round).join('/')}\n天候：${l.weather}　${l.surprise?'奇襲＋'+l.surprise+'%':''}\n${e}\n戦力 ${l.atkPower.toFixed(1)} vs ${l.defPower.toFixed(1)}　攻防比 ${(l.ratio*100).toFixed(1)}%\n${l.tier} / ${l.win?'攻撃軍が占領成功':'守備軍が防衛成功'}\n攻撃側 ${fmt(l.attackerStart)}兵 → ${fmt(l.attackerAfter)}兵（損失${fmt(l.attackerLoss)}）\n防御側 ${fmt(l.defenderStart)}兵 → ${l.win?'陥落（旧守備軍解体）':fmt(l.defenderAfter)+'兵'}（損失${fmt(l.defenderLoss)}）`}
function matchHTML(m){const a=m.a===null?'―':esc(s.teams[m.a].name),b=m.b===null?'―':esc(s.teams[m.b].name),w=m.result?.winner;return `<article class="match ${m.result?'done':''}"><div class="small muted">${m.id}</div><div class="vs"><span class="${w===m.a?'winner':''}"><b>${a}</b>${w===m.a?'🏆 WIN':''}</span><em>VS</em><span class="${w===m.b?'winner':''}"><b>${b}</b>${w===m.b?'🏆 WIN':''}</span></div>${m.result?`<div class="result">勝ち抜け：<b>${esc(s.teams[w].name)}</b>　<span class="score">攻撃比率 ${(m.result.legs[0].ratio*100).toFixed(1)}% / ${(m.result.legs[1].ratio*100).toFixed(1)}%</span></div><details><summary>⚔️ 2戦の詳細を見る</summary><div class="details">${m.result.legs.map(battleText).map(esc).join('\n\n──────────────────\n\n')}</div></details>`:'<p class="small muted">対戦待ち</p>'}</article>`}
function teamStrength(t){const a=t.picks.map(officer),n=national(a);return {leader:leader(a).name,n}}
function tournament(){const pending=s.matches.find(x=>!x.result&&x.a!==null&&x.b!==null),champ=s.matches[6].result?.winner;let html=`<div class="layout"><section class="box"><h2>🏟️ 決勝トーナメント</h2><div class="order">各試合、<b>攻守を交代した2戦</b>で決着。大勝・辛勝（攻防比110％以上）の占領成功を優先し、同じ成績なら攻防比の高いチームが進出します。兵力は各戦10,000兵に戻ります。</div><div class="row"><button class="primary" id="next" ${!pending?'disabled':''}>⚔️ ${pending?esc(pending.id)+'を戦う':'全試合終了'}</button><button id="all" ${!pending?'disabled':''}>全試合を自動進行</button><button id="reset" class="danger">新しい大会</button></div>${champ!==undefined?`<div class="champ"><div>🎊 初代チャンピオン 🎊</div><strong>${esc(s.teams[champ].name)}</strong><p>🏆 天下無双！八傑ドラフト杯制覇</p></div>`:''}${[1,2,3].map((r)=>`<div class="stage">${r===1?'準々決勝':r===2?'準決勝':'決勝'}</div>${s.matches.filter(m=>m.round===r).map(matchHTML).join('')}`).join('')}</section><aside class="box"><h2>👥 武将編成</h2>${s.teams.map((t,i)=>{const v=teamStrength(t);return `<details ${i===0?'open':''}><summary>${i+1}. ${esc(t.name)}　${t.picks.length}名</summary><p class="small">大将：<b class="gold">${esc(v.leader)}</b><br>合成能力：${v.n.map((x,k)=>['統','武','知','政'][k]+Math.round(x)).join(' ／ ')}</p><div class="small muted">${t.picks.map(id=>{const o=officer(id);return esc(o.name)+(o.trait==='なし'?'':` <span class="tag">${esc(o.trait)}</span>`)}).join('　・　')}</div></details>`}).join('')}</aside></div>`;$('app').innerHTML=html;$('next').onclick=nextMatch;$('all').onclick=allMatches;$('reset').onclick=reset}
function render(){if(!s)setup();else if(s.stage==='draft')draft();else tournament()}
if(load())render();else setup();
</script></body></html>
