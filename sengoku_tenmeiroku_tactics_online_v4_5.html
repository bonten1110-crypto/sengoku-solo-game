<details><summary>7. 戦術19種類</summary><p>兵種強化・側撃・背水は主将100%、副将50%・40%・25%で加算。挟撃は最大効果のみ。設置系、兵站、看破は役職によらず100%。兵站・看破は重複なし。</p><table><tr><th>戦術</th><th>効果</th></tr>${TACT.map(([t])=>`<tr><td>${esc(t)}</td><td>${esc(desc(t))}</td></tr>`).join('')}</table><p>挟撃：敵の反対側に味方が隣接していると発動。近接は両側隣接、遠距離は直線射程内。方向補正とは高い方を採用。</p></details>
<details ${o('result')}><summary>8. 勝敗・戦闘後</summary><p>本陣破壊、または敵全部隊の壊滅・撤退で即時勝利。20ターン終了時は砦占領数→本陣耐久→残存兵数→生存武将数→完全同点なら抽選。</p><p>毎ターン30%で自動イベント（一騎討ち、陣頭指揮、戦術偽報、兵站支援）。討死した武将は復活しない。武将は戦闘行動や試合後に成長し、才能開花することもある。勝者は敗者の生存武将を1人獲得。試合後は部隊政治×3の兵士補充を受け、次戦に向けて再編成できる。</p></details><p class="small">武将別戦績は主将に通常攻防・攻城・占領、戦術・イベントは発動武将に記録。MVPは暫定得点で集計。<br>v3.0：6人・8人正式大会を追加。1対1は6/8軍、2対2は3/4組。6人大会ではシード（不戦勝）あり。全員同時指名・重複抽選・落選者のみ再指名。勝ち抜き戦では兵数・武将・成長・戦術を引き継ぐ。CPU同士は自動戦闘。オンライン・別端末観戦は未実装。</p>`)}

function setup(){clearTimeout(cpuTimer);stageDeadline=deadline=0;$('app').innerHTML=`<div class="panel"><h2>大会・対戦設定</h2><p>ドラフトで武将を集め、CPUとの戦術戦闘を試そう。<span class="gold">特性なし・戦術19種類</span>。</p><div class="grid"><label>参加形式<select id="participants"><option value="6">正式大会・6人（自分＋CPU5人）</option><option value="8">正式大会・8人（自分＋CPU7人）</option><option value="0">従来の練習対戦</option></select></label><label>2対2のチーム決定<select id="pairMethod"><option value="random">ドラフト後ランダム</option><option value="balanced">ドラフト後戦力均衡</option><option value="pre">ドラフト前に指定</option><option value="manual">ドラフト後に自由指定</option></select></label><label>対戦形式<select id="mode"><option value="1">1対1（自軍3部隊）</option><option value="2">2対2（自軍2部隊＋友軍CPU）</option></select></label><label>ドラフト武将数<select id="limit">${[5,6,7,8,9,10].map(n=>`<option ${n===7?'selected':''}>${n}</option>`).join('')}</select></label><label>CPU難易度<select id="diff">${['初級','中級','上級','最上級'].map((n,i)=>`<option value="${i}" ${i===1?'selected':''}>${n}</option>`).join('')}</select></label><label>行動時間<select id="time"><option value="20">高速20秒</option><option value="45" selected>標準45秒</option><option value="90">低速90秒</option><option value="0">無制限</option></select></label></div><label>編成・配置時間<select id="prep"><option value="1">編成180秒・配置120秒</option><option value="0" selected>無制限（試作検証用）</option></select></label><div class="row"><button class="primary" onclick="startDraft()">ドラフト開始</button><button onclick="startDraft(true)">すぐに戦闘テスト（自動ドラフト）</button></div></div><div class="panel small"><div class="row spread"><b class="gold">遊び方</b><button onclick="openGuide()">簡易説明書を開く</button></div><p>候補10名から秘密指名 → 重複抽選 → 編成・兵種選択 → 配置・罠 → 完全速度順で敵本陣を攻略。最大20ターン。戦闘後は兵数・武将を引き継いで再戦できます。</p><p>6人・8人の正式大会は自分1人＋CPUで実施します。1対1は個人戦、2対2は固定ペア戦。人数不足の枠は不戦勝。CPU同士も同じ戦闘ルールで自動進行します。オンライン・別端末観戦は未搭載です。</p></div>`}
function startDraft(auto=false){let mode=+$('mode').value,limit=+$('limit').value,diff=+$('diff').value,time=+$('time').value,prep=+$('prep').value;g={stage:'draft',mode,limit,diff,time,prep,all:roster(),teams:Array.from({length:mode===1?2:4},(_,p)=>({p,ids:[]})),pool:shuf(RAW.map((_,i)=>i)),offers:[],round:1,wave:1,draftMsg:'',pending:[],match:1,log:[]};g.offers=g.pool.splice(0,10);if(auto){g.pool=shuf([...g.offers,...g.pool]);g.offers=[];for(let k=0;k<limit;k++)for(let t of g.teams)t.ids.push(g.pool.shift());beginFormation();return}draftRender()}
function draftScore(o){return total(o)+(g.diff>=2?(['挟撃','兵站','伏兵','看破'].includes(o.t)?14:0):0)+rand(0,[60,25,4,0][g.diff])} function draftRender(){g.stage='draft';save();let need=!g.teams[0].ids.length||g.teams[0].ids.length<g.round;$('app').innerHTML=`<div class="panel"><div class="row spread"><h2>武将ドラフト</h2><b class="gold">第${g.round}/${g.limit}巡 · 開票${g.wave}</b></div><p class="small">全員同時指名・重複時は抽選。落選者は残りの候補から再指名。</p>${g.draftMsg?`<p class="notice">${esc(g.draftMsg)}</p>`:''}<div class="grid">${g.offers.map(id=>{let o=off(id);return `<button class="card" ${need?'':'disabled'} onclick="draftPick(${id})"><strong>${esc(o.name)}</strong><div class="tac">戦術：${o.t}</div>${statHTML(o.v)}<div class="small">${esc(desc(o.t))}</div></button>`}).join('')}</div>${need?'':'<button class="primary" onclick="draftPick(null)">CPUの再指名を進める</button>'}</div><div class="panel"><h3>獲得状況</h3>${g.teams.map(t=>`<p><b>${ownerName(t.p)} ${t.ids.length}/${g.limit}</b><br><span class="small">${t.ids.map(id=>off(id).name+'［'+off(id).t+'］').join('・')||'未獲得'}</span></p>`).join('')}</div>`}
function draftPick(id){if(g.stage!=='draft')return;let need=g.teams.filter(t=>t.ids.length<g.round);if(need.some(t=>t.p===0)&&!g.offers.includes(id))return;let claims={};for(let t of need){let v=t.p===0?id:g.offers.slice().sort((a,b)=>draftScore(off(b))-draftScore(off(a)))[0];if(v!=null)(claims[v]??=[]).push(t.p)}let msg=[];for(let [id,ps] of Object.entries(claims)){let n=+id,p=pick(ps);g.teams[p].ids.push(n);g.offers=g.offers.filter(x=>x!==n);msg.push(off(n).name+' → '+ownerName(p)+(ps.length>1?'（'+ps.length+'人抽選）':''))}g.draftMsg=msg.join('／');if(g.teams.every(t=>t.ids.length>=g.round)){if(g.round===g.limit){beginFormation();return}g.round++;g.wave=1;while(g.offers.length<10&&g.pool.length)g.offers.push(g.pool.shift())}else g.wave++;draftRender()}
function makeMap(){let tiles=Array(90).fill('plain'),pair=(i,t)=>{tiles[i]=tiles[89-i]=t};let x=pick([2,3,4,5,6]);for(let r=0;r<4;r++)pair(r*9+x,'river');let river=Array.from({length:45},(_,i)=>i).filter(i=>tiles[i]==='river');for(let i of shuf(river).slice(0,rand(1,2)))pair(i,'bridge');let h=pick([1,2,3,4,5,6,7].filter(c=>tiles[c]==='plain'));pair(h,'hq');let f=36+rand(1,7);pair(f,'fort');for(let [t,n] of [['forest',rand(3,6)],['mountain',rand(2,4)],['wet',rand(1,3)]]){let free=shuf(Array.from({length:45},(_,i)=>i).filter(i=>tiles[i]==='plain'));free.slice(0,n).forEach(i=>pair(i,t))}g.tiles=tiles;g.buildings=[{pos:h,kind:'hq',side:0,hp:2500,max:2500},{pos:89-h,kind:'hq',side:1,hp:2500,max:2500},{pos:f,kind:'fort',side:null,hp:1000,max:1000},{pos:89-f,kind:'fort',side:null,hp:1000,max:1000}];g.traps=[]}
function autoFormation(p,carry){let n=g.mode===1?3:2,ids=g.teams[p].ids.filter(id=>!off(id).dead).sort((a,b)=>total(off(b))-total(off(a))),units=Array.from({length:n},(_,j)=>({id:p*3+j,p,side:side(p),ids:[],type:TYPELIST[(j+p)%4],hp:3000,pos:null,face:side(p)===0?2:0,out:false,def:false,retreat:false,buffs:{}}));for(let j=0;j<Math.min(n,ids.length);j++)units[j].ids.push(ids.shift());while(ids.length){let u=units.filter(u=>u.ids.length&&u.ids.length<4).sort((a,b)=>a.ids.length-b.ids.length)[0];if(!u)break;u.ids.push(ids.shift())}for(let u of units){let types=TYPELIST.slice().sort((a,b)=>(eff(u,b+'攻撃')+eff(u,b+'防御'))-(eff(u,a+'攻撃')+eff(u,a+'防御')));if(eff(u,types[0]+'攻撃')+eff(u,types[0]+'防御')>0)u.type=types[0];u.hp=u.ids.length?3000:0}if(g.diff===3&&(p!==0||cpuOnly())){let chosen=[];for(let u of units.filter(x=>x.ids.length)){let bestType=TYPELIST.map(t=>{let a=TYPES[t],score=eff(u,t+'攻撃')*34+eff(u,t+'防御')*30+(t==='足軽'?defenseAbility(u)*.12:t==='鉄砲'?attackAbility(u)*.11:t==='騎馬'?attackAbility(u)*.09:attackAbility(u)*.08);score-=chosen.filter(x=>x===t).length*17;if(!chosen.includes('足軽')&&chosen.length===units.filter(x=>x.ids.length).length-1&&t==='足軽')score+=25;if(best(u,'挟撃')&&['弓兵','鉄砲'].includes(t))score+=7;return{t,score}}).sort((a,b)=>b.score-a.score)[0].t;u.type=bestType;chosen.push(bestType)}}if(carry!=null){let rem=carry;for(let u of units){u.hp=u.ids.length?Math.min(maxHp(u),Math.floor(carry/Math.max(1,units.filter(x=>x.ids.length).length))):0;rem-=u.hp}for(let u of units){let add=Math.min(rem,u.ids.length?maxHp(u)-u.hp:0);u.hp+=add;rem-=add}if(rem>0)log(ownerName(p)+'：兵数上限により'+rem+'人を編成できず')}return units}
function beginFormation(){clearTimeout(cpuTimer);g.stage='formation';g.turn=0;g.log=[];g.records={};g.recordDone=false;g.queue=[];g.qi=0;makeMap();let old=g.carry;g.units=g.teams.flatMap(t=>autoFormation(t.p,old?.[t.p]));g.budget=g.units.filter(u=>u.p===0).reduce((n,u)=>n+u.hp,0);g.formMsg='';g.inspect=null;stageDeadline=g.prep?Date.now()+180000:0;formRender()}
function terrainLegend(){return `<div class="legend">${Object.entries(TERR).map(([k,v])=>`<span class="${k}">${v} ${({plain:'平地',forest:'森 防+10%',mountain:'山 防+15% 射程+1',river:'川 防−10%',wet:'湿地 騎攻−15%',bridge:'橋',fort:'砦 防+15%',hq:'本陣 防+20%'})[k]}</span>`).join('')}</div>`}

function formRender(){save();let us=g.units.filter(u=>u.p===0),ids=g.teams[0].ids.filter(id=>!off(id).dead),used=us.flatMap(u=>u.ids);$('app').innerHTML=`<div class="layout"><div class="panel"><div class="row spread"><h2>第${g.match}戦・戦場確認</h2><b id="stageClock" class="gold"></b></div>${mapHTML()}${terrainLegend()}<p class="small">縦10×横9（90マス）。青陣営は上側・赤陣営は下側。中央2行は中立。戦場を見て兵種を決めよう。</p><div class="rostercompare"><section><h3 class="blue">保有武将一覧（${ids.length}）</h3>${rosterList(ids,true)}</section><section><h3 class="red">相手・友軍武将一覧</h3>${g.teams.filter(t=>t.p!==0).map(t=>`<h4 class="${side(t.p)===0?'blue':'red'}">${side(t.p)===0?'友軍：':'敵軍：'}${esc(ownerName(t.p))}（${t.ids.filter(id=>!off(id).dead).length}）</h4>${rosterList(t.ids.filter(id=>!off(id).dead),false)}`).join('')}</section></div></div><div class="panel"><h2>部隊編成</h2><div class="stepbox">① 武将枠をタップして能力を比較・選択<br>② 兵種を選択　③ 「配置へ」で確定</div><p>配分可能兵数：<b>${fmt(g.budget)}人</b> ／ 配分済 <b>${fmt(us.reduce((n,u)=>n+u.hp,0))}</b></p>${g.formMsg?`<p class="notice">${esc(g.formMsg)}</p>`:''}${us.map((u,j)=>`<div class="unitcard formunit"><h3>第${j+1}部隊</h3>${[0,1,2,3].map(k=>slotCard(u,k)).join('')}<label>兵種<select onchange="changeType(${u.id},this.value)">${TYPELIST.map(t=>`<option ${u.type===t?'selected':''}>${t}</option>`).join('')}</select></label><div class="small">攻${TYPES[u.type].atk}　防${TYPES[u.type].def}　移動${TYPES[u.type].mv}　射程${TYPES[u.type].min}〜${TYPES[u.type].max}</div><label>兵数（上限 ${fmt(maxHp(u))}）<input type="number" inputmode="numeric" min="0" max="${maxHp(u)}" value="${u.hp}" ${isFirstForm()?'disabled':''} onchange="changeHp(${u.id},this.value)"></label><div class="formsummary"><b class="small">部隊の合成能力</b>${fullStats(stats(u))}<div class="small">攻撃 ${attackAbility(u).toFixed(1)}　防御 ${defenseAbility(u).toFixed(1)}　行動順 ${speed(u).toFixed(1)}</div></div></div>`).join('')}<p class="small">${isFirstForm()?'初戦は各部隊3,000兵固定。次戦以降は自由配分。<br>':''}控え：${ids.filter(id=>!used.includes(id)).map(id=>off(id).name).join('・')||'なし'}</p function changeOfficer(id,k,val){let u=g.units.find(u=>u.id===id);let before=u.ids.slice();if(val===''){if(k===0&&u.ids.length>1){u.ids.shift()}else if(k<u.ids.length)u.ids.splice(k,1)}else{let n=+val;if(g.units.some(x=>x.p===0&&x.ids.includes(n))&&u.ids[k]!==n)return;if(k>u.ids.length){g.formMsg='副将は上から順に選んでください。';formRender();return}u.ids[k]=n}if(!u.ids.length&&u.hp>0){g.formMsg='主将がいない部隊の兵数は0にしてください。'}else g.formMsg='';formRender()}

function deployCells(s){return Array.from({length:18},(_,i)=>s===0?i:72+i)} function autoDeploy(s){let us=g.units.filter(u=>u.side===s&&alive(u));let h=g.buildings.find(b=>b.side===s&&b.kind==='hq').pos;let cells=deployCells(s).sort((a,b)=>{let front=i=>s===0?Math.floor(i/9):9-Math.floor(i/9);return (front(b)-front(a))*10+dist(a,h)-dist(b,h)});us.forEach((u,j)=>{u.pos=cells[j];u.face=s===0?2:0});if(us.length){let defender=us.find(u=>u.type==='足軽')||us[us.length-1];defender.pos=h;if(g.diff===3){let fixed=new Set([h,...us.filter(u=>u.p===0&&!cpuOnly()&&u!==defender).map(u=>u.pos)]);for(let u of us.filter(u=>(u.p!==0||cpuOnly())&&u!==defender)){let opts=deployCells(s).filter(i=>!fixed.has(i));let rate=i=>{let front=s===0?pos(i)[0]:9-pos(i)[0],terrain=g.tiles[i];return front*25+(terrain==='mountain'&&['弓兵','鉄砲'].includes(u.type)?35:terrain==='forest'?12:0)-(terrain==='river'&&u.type==='鉄砲'?35:0)-Math.min(...g.buildings.filter(b=>b.kind==='fort').map(b=>dist(i,b.pos)))*4};u.pos=opts.sort((a,b)=>rate(b)-rate(a))[0];fixed.add(u.pos)}}}}

function startBattle(){if(g.stage!=='deploy')return;stageDeadline=0;autoTraps();g.stage='battle';g.turn=1;g.inspect=null;g.units.forEach(u=>{u.initiative=Math.round(speed(u)*1000)/1000;u.initiativeTie=Math.random();u.deployed=alive(u);if(u.deployed)u.ids.forEach(id=>rec(id,'played',1));u.def=false;u.retreat=false;u.buffs={}});let removed=[0,0];for(let s of [0,1]){let seers=living().filter(u=>u.side===s&&eff(u,'看破'));if(!seers.length)continue;g.traps=g.traps.filter(tr=>{if(tr.side===s||!HIDDEN.includes(tr.t)||Math.random()>=.5)return true;removed[s]++;return false});if(removed[s])seers.forEach(u=>tacticGrow(u,'看破'))}log('開戦！');if(removed[0])log('自陣営の看破で敵の罠を'+removed[0]+'個無効化');if(removed[1])log('敵の看破で自陣営の罠を'+removed[1]+'個無効化');newTurn(true)}
function newTurn(first=false){if(!first){for(let u of living()){let hs=holders(u,'兵站');if(hs.length){let o=hs.sort((a,b)=>b.o.v[3]-a.o.v[3])[0].o;let n=Math.min(maxHp(u)-u.hp,Math.floor(maxHp(u)*o.v[3]/100*.02));if(n>0){u.hp+=n;rec(o.id,'heal',n);rec(o.id,'tactics',1);log(unitName(u)+' 兵站＋'+n+'兵');growth(o,2)}}}if(checkWin())return;if(g.turn>=20){judge();return}g.turn++}g.queue=living().slice().sort((a,b)=>b.initiative-a.initiative||b.initiativeTie-a.initiativeTie).map(u=>u.id);g.qi=0;g.action={moved:false,attacked:false,mode:'move'};g.inspect=null;log('第'+g.turn+'ターン');if(Math.random()<.3){eventRoll();if(g.stage!=='battle')return;if(modalOpen){renderBattle();return}}beginAction()}

function endAction(kind='normal'){let u=current();if(g.stage!=='battle'||!alive(u)||modalOpen)return;if(kind!=='normal'&&(g.action.moved||g.action.attacked))return;if(kind==='defend'){u.def=true;log(unitName(u)+' 防御')}if(kind==='retreat'){u.def=true;u.retreat=true;log(unitName(u)+' 撤退準備（次の行動順で離脱）')}g.qi++;deadline=0;beginAction()}

function moveCost(u,i){let t=g.tiles[i],cost=['mountain','river','wet'].includes(t)&&u.type!=='足軽'?2:1;if(g.traps.some(tr=>tr.pos===i&&tr.side!==u.side&&tr.t==='防柵'))cost=Math.max(2,cost);return cost}

function attackTargets(u,from=u.pos){let {min,max}=TYPES[u.type],mount=g.tiles[from]==='mountain';if(['弓兵','鉄砲'].includes(u.type)&&mount)max++;let res=[],[r,c]=pos(from);let rays=DIRS.map(d=>[...d,max]);if(u.type==='足軽'||u.type==='弓兵')rays.push(...[[-1,-1],[-1,1],[1,-1],[1,1]].map(d=>[...d,u.type==='足軽'?1:mount?3:2]));for(let [dr,dc,range] of rays){for(let d=1;d<=range;d++){let i=idx(r+dr*d,c+dc*d);if(i<0)break;let z=at(i);if(z===u)z=null;if(z&&z.side!==u.side){if(d>=min)res.push({pos:i,u:z});break}let b=building(i);if(b&&b.side!==u.side&&b.hp>0&&!z){if(d>=min)res.push({pos:i,b});break}}}return res}
function markBuff(u,k,v,turns){let b=u.buffs[k];u.buffs[k]={v:Math.max(v,b&&b.until>=g.turn?b.v:0),until:g.turn+turns-1}}function buff(u,k){let b=u.buffs[k];return b&&b.until>=g.turn?b.v:0}
function ownerUnit(id){return g.units.find(u=>u.ids.includes(id))} function trapGrow(tr){rec(tr.id,'tactics',1);let o=off(tr.id);if(!o.dead)growth(o,2)}

function killOfficer(u,id,reason){let o=off(id);if(o.dead)return;o.dead=true;let old=unitName(u);u.ids=u.ids.filter(x=>x!==id);log(o.name+' 討死（'+reason+'）');g.notices.push(o.name+' 討死');if(u.ids.length){if(unitName(u)!==old)log(unitName(u)+' が主将を継承');u.hp=Math.min(u.hp,maxHp(u))}else if(u.hp>0){u.out=true;log('指揮官不在のため部隊は撤退')}}

function trapStep(u,i){let stop=false;for(let tr of [...g.traps.filter(x=>x.pos===i&&x.side!==u.side)]){if(tr.t==='陣地構築'){g.traps=g.traps.filter(x=>x!==tr);log('敵の構築陣地を破壊');continue}if(!HIDDEN.includes(tr.t))continue;g.traps=g.traps.filter(x=>x!==tr);let msg='';if(tr.t==='伏兵'){let loss=hitHp(u,u.hp*roll(10,15));rec(tr.id,'damage',loss);if(!alive(u))rec(tr.id,'kills',1);msg=unitName(u)+' −'+loss+'兵'}else if(tr.t==='落とし穴'){let loss=hitHp(u,u.hp*(u.type==='騎馬'?.08:.04));stop=true;rec(tr.id,'damage',loss);if(!alive(u))rec(tr.id,'kills',1);msg=unitName(u)+' −'+loss+'兵・移動終了'}else{let ts=living().filter(x=>square(x.pos,i)<=1);msg=ts.map(z=>{let name=unitName(z),loss=hitHp(z,z.hp*.08);if(z.side!==tr.side){rec(tr.id,'damage',loss);if(!alive(z))rec(tr.id,'kills',1)}if(alive(z))markBuff(z,'fire',.10,1);return name+' −'+loss}).join('／')}log(tr.t+' 発動：'+msg);g.notices.push(tr.t+'：'+msg);trapGrow(tr)}return stop}
function doMove(u,i){if(!alive(u)||g.action.moved||g.action.attacked)return;let path=arguments[2]||reachable(u).get(i)?.path;if(!path?.length||!routeCheck(u,path).ok||at(i))return;g.action.path=[];g.action.moved=true;g.notices=[];let old=u.pos,lastFree=u.pos;for(let n of path){let prev=u.pos,occupied=at(n);u.pos=n;if(!occupied)lastFree=n;u.face=direction(prev,n);let stop=trapStep(u,n);if(!alive(u))break;let b=building(n);if(b&&b.kind==='fort'&&b.hp===0&&b.side!==u.side){b.side=u.side;b.hp=1000;rec(u.ids[0],'forts',1);log(ownerName(u.p)+'が砦を占領！');g.notices.push('砦占領！')}if(stop){if(occupied)u.pos=lastFree;break}}log(unitName(u)+' 移動 '+(old+1)+'→'+(u.pos+1));if(checkWin())return;if(!alive(u)){g.qi++;beginAction();return}if(g.notices.length){let text=g.notices.join('／');if(u.p===0&&!cpuOnly())notify('戦術発動',esc(text),()=>renderBattle())}}
function fortCount(s){return g.buildings.filter(b=>b.kind==='fort'&&b.side===s&&b.hp>0).length}function fortBuff(s){return [0,.10,.15][fortCount(s)]||0}function matchup(a,b){if(a===b||a==='足軽'||b==='足軽')return 0;return (a==='騎馬'&&b==='弓兵'||a==='弓兵'&&b==='鉄砲'||a==='鉄砲'&&b==='騎馬')?1:-1}
function flank(u,z,from=u.pos){if(pos(from)[0]!==pos(z.pos)[0]&&pos(from)[1]!==pos(z.pos)[1])return false;let dir=direction(from,z.pos),[r,c]=pos(z.pos),[dr,dc]=DIRS[dir],i=idx(r+dr,c+dc);let ally=at(i);return ally&&ally.side===u.side&&ally.id!==u.id&&(['足軽','騎馬'].includes(u.type)?dist(from,z.pos)===1:true)}
function directionKind(u,z,from=u.pos){let [r,c]=pos(z.pos),[a,b]=pos(from),[dr,dc]=DIRS[z.face];let dot=(a-r)*dr+(b-c)*dc;if(dot<0)return '背面';if(dot>0&&(a===r||b===c))return '正面';return '側面'}
function attackModifiers(u,kind='正面'){let n=.10*eff(u,u.type+'攻撃')+fortBuff(u.side)+buff(u,'command');if(u.hp<=maxHp(u)*.5)n+=.15*eff(u,'背水');if(kind!=='正面')n+=.10*eff(u,'側撃');let t=g.tiles[u.pos];if(t==='wet'&&u.type==='騎馬')n-=.15;if(t==='river'&&u.type==='鉄砲')n-=.10;return Math.max(.1,1+n)}
function defModifiers(z){let t=g.tiles[z.pos],n=({forest:.10,mountain:.15,river:-.10,fort:.15,hq:.20})[t]||0;n+=fortBuff(z.side)+buff(z,'command')+buff(z,'duel')-buff(z,'fake')-buff(z,'fire')+.10*eff(z,z.type+'防御');if(g.traps.some(tr=>tr.t==='陣地構築'&&tr.side===z.side&&tr.pos===z.pos))n+=.15;return Math.max(.1,1+n)}
function smoke(u,z){if(!['弓兵','鉄砲'].includes(u.type))return 0;return Math.max(0,...g.traps.filter(t=>t.t==='煙幕'&&t.side===z.side&&square(t.pos,z.pos)<=1).map(t=>t.rate/100))}
let lastGuard=0;function damageEstimate(u,z,from=u.pos,random=false){let k=directionKind(u,z,from),d=k==='正面'?0:k==='側面'?(random?roll(10,15):.125):(random?roll(20,30):.25);if(flank(u,z,from))d=Math.max(d,.70*best(u,'挟撃'));let m=matchup(u.type,z.type)*(random?roll(15,25):.2),guard=z.def?(k==='正面'?(random?roll(30,40):.35):k==='側面'?(random?roll(15,20):.175):0):0;if(random)lastGuard=guard;return Math.max(1,Math.round(.12*Math.sqrt(u.hp*z.hp)*attackAbility(u)/Math.max(1,defenseAbility(z))*TYPES[u.type].atk/TYPES[z.type].def*(1+m)*(1+d)*attackModifiers(u,k)/defModifiers(z)*(1-guard)*(1-smoke(u,z))*(random?roll(90,110):1)))}

p>経路 ${path.map(i=>i+1).join('→')} ／ 残り移動力 ${E.types[u.type].mv-E.routeCheck(u,path).cost}</p><div class="row"><button ${path.length&&!E.at(path.at(-1))?'':'disabled'} onclick="sendMove()">移動確定</button><button onclick="path.pop();render()">一歩戻す</button><button onclick="path=[];render()">取消</button></div><p>終了時の向き <select onchange="face=+this.value">${opts(E.arrows.map((v,i)=>[i,v]),face)}</select></p><div class="row"><button class="primary" onclick="cmd('end',{kind:'normal',face})">行動終了</button><button ${g.action.moved||g.action.attacked?'disabled':''} onclick="cmd('end',{kind:'defend',face})">防御</button><button ${g.action.moved||g.action.attacked?'disabled':''} onclick="cmd('end',{kind:'retreat',face})">撤退</button></div></div>`:''}<div class="panel"><h3>部隊情報</h3>${g.units.map(u=>`<p class="${u.side===0?'blue':'red'}">${esc2(S.slots[u.p].name)}｜${esc2(E.unitName(u))} ${u.type} ${u.hp}兵 ${u.out?'離脱':''} ${E.arrows[u.face]}<br><span class="small">${u.ids.map(id=>info(g.all[id])).join('<br>')}</span></p>`).join('')}</div>`}else if(phase==='result'){body=`<div class="panel"><h2>${g.winner===0?'青軍':'赤軍'} 勝利</h2><p>${esc2(g.reason)}／${g.turn}ターン</p>${g.awards.map(x=>`<p>${esc2(x)}</p>`).join('')}${g.bloom.map(x=>`<p>${esc2(x)}</p>`).join('')}${me===S.host?'<button class="primary" onclick="cmd(\'rematch\')">同じ部屋で新規ドラフト</button>':''}</div>${E.recordHTML()}`}
if(g?.log?.length)body+=`<div class="panel"><h3>戦況ログ</h3>${g.log.slice(0,30).map(x=>`<div class="small">${esc2(x)}</div>`).join('')}</div>`;el('app').innerHTML=head+body;updateClock();if(g?.scenes){if(seen>g.sceneSeq)seen=0;for(let v of g.scenes.filter(v=>v.id>seen))sceneQueue.push(v);seen=g.sceneSeq;scene()}}
function submitForm(){let units=edit.map(u=>({...u,ids:u.ids.filter(x=>x!=null)}));if(edit.some(u=>u.ids[0]==null)){error(Error('主将を選択してください'));return}cmd('form',{units})}
function board(){let g=S.g,u=E.current(),can=S.phase==='battle'&&u?.p===S.me&&S.me>=0,targets=can&&mode==='attack'&&!g.action.attacked?E.attackTargets(u).map(t=>t.pos):[],moves=can&&mode==='move'&&!g.action.moved&&!g.action.attacked?E.reachable(u):new Map();return `<div class="panel"><div class="onboard">${g.tiles.map((t,i)=>{let z=E.at(i),b=E.building(i),tr=g.traps.find(x=>x.pos===i),active=path.includes(i),legal=S.phase==='deploy'&&S.me>=0&&!S.ready.includes(S.me)&&(trap!=null?E.trapLegal(g.all[trap].t,i,E.side(S.me),trap):selected!=null&&E.deployCells(E.side(S.me)).includes(i));return `<button class="oncell ${t} ${active?'pathcell':targets.includes(i)?'targetcell':moves.has(i)||legal?'movecell':''}" onclick="cell(${i})"><span>${E.terr[t]}${b?' '+b.hp:''}</span>${z?`<b class="${z.side===0?'blue':'red'}">${esc2(E.unitName(z).slice(0,3))}${E.arrows[z.face]}<br>${z.type} ${z.hp}</b>`:''}${tr?`<small>${esc2(tr.t)}</small>`:''}${active?'<em>●</em>':''}</button>`}).join('')}</div><p class="small">平：平地／森：防御+10%／山：防御+15%・射程増／川：防御−10%／砦・本陣：防御補正。青枠＝移動・配置、赤枠＝攻撃、黄＝経路。</p></div>`}
function cell(i){if(S.phase==='deploy'){if(trap!=null)cmd('trap',{id:trap,pos:i});else if(selected!=null)cmd('deploy',{id:selected,pos:i});return}let u=E.current();if(S.phase!=='battle'||u?.p!==S.me||S.me<0)return;if(mode==='attack'){if(E.attackTargets(u).some(t=>t.pos===i))cmd('attack',{pos:i});return}if(S.g.action.moved||S.g.action.attacked)return;if(!manual){path=E.reachable(u).get(i)?.path||[]}else{let j=path.indexOf(i);if(j>=0)path=path.slice(0,j+1);else if(i===u.pos)path=[];else if(E.routeCheck(u,[...path,i]).ok)path.push(i)}render()}
async function sendMove(){let v=await cmd('move',{path:path.slice()});if(v){path=[];mode='attack';face=E.current()?.face||face;render()}}
function updateClock(){if(el('clock'))el('clock').textContent=S?.due?'残り '+Math.max(0,Math.ceil((S.due-Date.now())/1000))+'秒':''}setInterval(updateClock,250);entry();
</script></body></html>
