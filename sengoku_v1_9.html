<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>戦国十五国 v1.9</title><style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#f3ead5;background:#131b20}*{box-sizing:border-box}body{margin:0}header{position:sticky;top:0;z-index:5;background:#202d30;padding:10px;border-bottom:2px solid #b79b58}h1{font-size:20px;margin:0 0 6px}.stats{display:flex;gap:8px;flex-wrap:wrap;font-size:13px}.stats span{background:#354344;padding:5px 8px;border-radius:8px}main{max-width:950px;margin:auto;padding:12px}nav{display:flex;gap:5px;overflow-x:auto;position:sticky;top:91px;background:#131b20;padding:7px 0;z-index:4}button,select,input{font:inherit}button{background:#b79750;color:#171b18;border:0;border-radius:8px;padding:10px 12px;font-weight:700;cursor:pointer}button:disabled{opacity:.4}button.secondary{background:#3b5556;color:#fff}button.danger{background:#8e4745;color:white}nav button{white-space:nowrap;font-size:13px;padding:9px}.card{background:#233136;border:1px solid #485655;border-radius:12px;padding:14px;margin:12px 0}h2{font-size:18px;margin:0 0 10px;color:#eacb81}h3{margin:10px 0 7px}p{line-height:1.6}.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:9px 0}label{display:block;margin:9px 0}select,input{width:100%;background:#e8e5d9;color:#1c2626;border:0;border-radius:7px;padding:10px;margin-top:5px}small,.muted{color:#b7c2bf}.item{padding:10px;border-bottom:1px solid #52605c}.item:last-child{border-bottom:0}.badge{display:inline-block;background:#49645d;border-radius:6px;padding:3px 7px;font-size:12px;margin:2px}.good{color:#a8e5b5}.warn{color:#ffd28c}.bad{color:#f5a5a5}.hidden{display:none} .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:8px}.notice{background:#3c4534;border-left:4px solid #e6bd66;padding:10px;border-radius:5px}.actions{display:flex;gap:6px;flex-wrap:wrap}details{margin:8px 0}summary{cursor:pointer;font-weight:700}#toast{position:fixed;bottom:12px;left:10px;right:10px;max-width:550px;margin:auto;background:#e9cf86;color:#162121;border-radius:10px;padding:12px;display:none;z-index:10}@media(max-width:550px){header{padding:8px}h1{font-size:17px}nav{top:94px}.card{padding:11px}button{padding:9px}}
</style></head><body><header><h1>🏯 戦国十五国 <small>v1.9 ソロプレイ</small></h1><div id="stats" class="stats"></div></header><main><nav id="nav"></nav><div id="screen"></div></main><div id="toast"></div><script>
'use strict';
const NAMES=['伊達','上杉','武田','北条','織田','徳川','豊臣','毛利','島津','長宗我部','大友','最上','佐竹','浅井','尼子'];
const DAIMYO=['伊達政宗','上杉謙信','武田信玄','北条氏康','織田信長','徳川家康','豊臣秀吉','毛利元就','島津義弘','長宗我部元親','大友宗麟','最上義光','佐竹義重','浅井長政','尼子晴久'];
const TRAITS=[['猛将',5],['守将',5],['能吏',5],['募兵',4],['軍師',3],['築城',3],['人望',2.8],['奇襲',2],['鬼謀',.1],['鬼将',.1],['なし',70]];
const PERSONAL=['好戦型','内政型','策略型','野心型'];const WEIGHTS=[[30,15,25,5,25],[50,20,15,10,5],[40,15,15,25,5],[35,15,20,10,20]];
const COMMANDS=['内政','登用','募兵','偵察','調略','焼き討ち','同盟申請','援軍設定','戦争','裏切り侵攻','褒美'];
const OFFICER_SURNAMES=['真田','竹中','山本','黒田','本多','前田','直江','石田','片倉','立花','高坂','宇佐美','鍋島','加藤','福島','蒲生','井伊','小西','明智','滝川','森','服部','大谷','吉川','小早川','榊原','斎藤','山県','酒井','島','朝倉','細川','丹羽','馬場','柴田','宇喜多','藤堂','今川','山中','赤井'];
const OFFICER_GIVEN=['幸村','半兵衛','勘助','官兵衛','忠勝','慶次','兼続','三成','小十郎','宗茂','昌信','定満','直茂','清正','正則','氏郷','直政','行長','光秀','一益','長可','半蔵','吉継','元春','隆景','康政','道三','昌景','忠次','左近','義景','忠興','長秀','信春','勝家','直家','高虎','義元','鹿介','直正'];
const rand=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;const pick=a=>a[rand(0,a.length-1)];const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const trait=()=>{let x=Math.random()*100;for(const [n,p] of TRAITS){x-=p;if(x<0)return n}return 'なし'};
let state=null,tab='ホーム',editing=-1;const SAVE='sengoku15_v19_save';
function officer(id){const tier=Math.random();const sum=tier<.15?rand(350,380):tier<.65?rand(320,349):rand(265,319);let v=[rand(55,95),rand(55,95),rand(55,95),rand(55,95)];let scale=sum/v.reduce((a,b)=>a+b,0);v=v.map(x=>Math.round(x*scale));return {id,name:OFFICER_SURNAMES[id%40]+OFFICER_GIVEN[Math.floor(id/40)%40],stats:v,trait:trait(),loyalty:rand(70,100),owner:-1}}
function adjacency(i,j){return i!==j&&(Math.abs(i-j)===1||(i===0&&j===14)||(i===14&&j===0)||([0,3,6,9,12].includes(i)&&j===(i+3)%15)||([0,3,6,9,12].includes(j)&&i===(j+3)%15))}
function newGame(player){const officers=Array.from({length:200},(_,i)=>officer(i));const factions=NAMES.map((name,i)=>({id:i,name,daimyo:DAIMYO[i],gold:2000,territories:[i],allies:[],personality:PERSONAL[i%4],loyaltyPenalty:0}));const lands=NAMES.map((name,i)=>({id:i,name,owner:i,soldiers:5000,guard:0}));const daimyoStats=NAMES.map((_,i)=>[rand(85,110),rand(85,110),rand(85,110),rand(85,110)]);officers.forEach((o,i)=>{if(i<30){o.owner=Math.floor(i/2);o.loyalty=90}});state={version:'1.9',player,turn:1,lands,factions,officers,daimyoStats,orders:[],logs:['天下統一への戦いが始まった！'],scouts:{},offers:[],candidates:[],over:false};refreshCandidates();save();tab='ホーム';render()}
function save(){if(state)localStorage.setItem(SAVE,JSON.stringify(state))}function load(){try{const s=JSON.parse(localStorage.getItem(SAVE));if(s&&s.version==='1.9'&&Array.isArray(s.lands)&&Array.isArray(s.orders)){state=s;return true}}catch(e){}return false}
function faction(i){return state.factions[i]}function mine(){return faction(state.player)}function mylands(){return state.lands.filter(l=>l.owner===state.player)}function myofficers(){return state.officers.filter(o=>o.owner===state.player)}function neighbors(owner){const own=state.lands.filter(l=>l.owner===owner);return state.factions.filter(f=>f.id!==owner&&state.lands.some(l=>l.owner===f.id&&own.some(x=>adjacency(x.id,l.id))))}
function allies(i){return faction(i).allies.filter(a=>a.until>=state.turn)}function allied(i,j){return allies(i).some(a=>a.id===j)}function power(owner){return faction(owner).territories.length*100000+state.lands.filter(l=>l.owner===owner).reduce((a,l)=>a+l.soldiers,0)}function ability(owner,land,idx){const base=state.daimyoStats[owner][idx];const oo=state.officers.filter(o=>o.owner===owner);return base+Math.ceil(oo.reduce((a,o)=>a+o.stats[idx],0)/8)}function politics(owner,land){return ability(owner,land,3)}function hasTrait(owner,t){return state.officers.some(o=>o.owner===owner&&o.trait===t)}
function cap(){return Math.min(15,1+mylands().length*2)}function toast(t){const el=document.getElementById('toast');el.textContent=t;el.style.display='block';clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>el.style.display='none',3200)}function log(t){state.logs.unshift(`第${state.turn}ターン：${t}`);state.logs=state.logs.slice(0,100)}function refreshCandidates(){const pool=state.officers.filter(o=>o.owner===-1).map(o=>o.id);for(let i=pool.length-1;i>0;i--){const j=rand(0,i);[pool[i],pool[j]]=[pool[j],pool[i]]}state.candidates=pool.slice(0,12)}
function opts(arr,val,label){return arr.map(x=>`<option value="${esc(val(x))}">${esc(label(x))}</option>`).join('')}
function status(){if(!state)return;const f=mine();const total=mylands().reduce((a,l)=>a+l.soldiers,0);document.getElementById('stats').innerHTML=`<span>第${state.turn}/60ターン</span><span>${esc(f.name)}家</span><span>💰${f.gold.toLocaleString()}</span><span>🪖${total.toLocaleString()}</span><span>🏯${mylands().length}領</span><span>👤${myofficers().length}人</span><span>📋${state.orders.length}/${cap()}</span>`}
function render(){if(!state){document.getElementById('stats').innerHTML='<span>新規開始</span>';document.getElementById('nav').innerHTML='';document.getElementById('screen').innerHTML=`<section class="card"><h2>⚔️ 天下統一を目指そう</h2><p>15勢力から大名を選んでスタート。データはこのブラウザに保存されます。</p><label>大名を選択<select id="startDaimyo">${DAIMYO.map((n,i)=>`<option value="${i}">${n}（${NAMES[i]}家）</option>`).join('')}</select></label><button onclick="newGame(+document.getElementById('startDaimyo').value)">この大名で開始</button>${localStorage.getItem(SAVE)?'<p class="muted">以前のデータがある場合はページ再読込で復帰できます。</p>':''}</section>`;return}status();const tabs=['ホーム','命令','勢力','武将','外交','戦況','遊び方'];document.getElementById('nav').innerHTML=tabs.map(t=>`<button class="${tab===t?'':'secondary'}" onclick="tab='${t}';render()">${t}</button>`).join('');const body={ホーム:home,命令:ordersUI,勢力:landsUI,武将:officersUI,外交:diplomacyUI,戦況:logsUI,遊び方:helpUI}[tab]();document.getElementById('screen').innerHTML=body}
function home(){return `<div class="card"><h2>🏯 ${esc(mine().name)}家の状況</h2><p>あなたの領地：${mylands().map(l=>esc(l.name)).join('・')}</p><p>隣接勢力：${neighbors(state.player).map(f=>esc(f.name)+'家').join('・')||'なし'}</p><p class="notice">この試作版は「次のターンへ」で9時・21時の更新を手動再現します。実時間での自動更新やオンライン対戦は未実装です。</p><div class="actions"><button onclick="tab='命令';render()">命令を出す</button><button onclick="nextTurn()" ${state.over?'disabled':''}>▶ 次のターンへ（命令を実行）</button></div></div><div class="card"><h2>📋 予約中の命令</h2>${orderList()}<button class="secondary" onclick="tab='命令';render()">命令を編集</button></div><div class="card"><h2>📜 最近の出来事</h2>${state.logs.slice(0,5).map(l=>`<div class="item">${esc(l)}</div>`).join('')}</div>`}
function orderList(){return state.orders.length?state.orders.map((o,i)=>`<div class="item"><b>${i+1}. ${esc(o.type)}</b>　${esc(orderSummary(o))}<div class="actions"><button class="secondary" onclick="editOrder(${i})">変更</button><button class="danger" onclick="deleteOrder(${i})">削除</button></div></div>`).join(''):'<p class="muted">まだ命令はありません。</p>'}
function orderSummary(o){let v=[];if(o.land!==undefined)v.push(state.lands[o.land]?.name+'領');if(o.target!==undefined)v.push(faction(o.target)?.name+'家');if(o.officer!==undefined)v.push(state.officers[o.officer]?.name);if(o.gold!==undefined)v.push(o.gold+'金');if(o.soldiers!==undefined)v.push(o.soldiers+'人');if(o.percent!==undefined)v.push(o.percent+'%');return v.filter(Boolean).join(' / ')}
function ordersUI(){const occupied=state.orders.filter((_,i)=>i!==editing).map(o=>o.type);const available=COMMANDS.filter(c=>!occupied.includes(c));return `<section class="card"><h2>📋 命令一覧（${state.orders.length}/${cap()}）</h2><p class="muted">1件ずつ変更・削除できます。ほかの命令は消えません。</p>${orderList()}${state.orders.length?'<button class="danger" onclick="clearOrders()">全命令を削除</button>':''}</section><section class="card"><h2>${editing<0?'➕ 命令を追加':'✏️ 命令を変更'}</h2>${editing<0&&state.orders.length>=cap()?'<p>命令枠がいっぱいです。</p>':`<label>命令の種類<select id="cmdType" onchange="renderFields()">${available.map(c=>`<option ${editing>=0&&state.orders[editing].type===c?'selected':''}>${c}</option>`).join('')}</select></label><div id="fields"></div><div class="actions"><button onclick="commitOrder()">${editing<0?'命令を追加':'変更を保存'}</button>${editing>=0?'<button class="secondary" onclick="editing=-1;render()">キャンセル</button>':''}</div>`}</section>`}
function editOrder(i){tab='命令';editing=i;render();renderFields();const o=state.orders[i];['land','target','officer','gold','soldiers','percent'].forEach(k=>{const e=document.getElementById('fld_'+k);if(e&&o[k]!==undefined)e.value=o[k]})}
function renderFields(){const el=document.getElementById('fields');if(!el)return;const type=document.getElementById('cmdType').value;const my=mylands(),enemy=state.lands.filter(l=>l.owner!==state.player),adj=enemy.filter(l=>my.some(x=>adjacency(x.id,l.id)));const landSel=(ls)=>`<label>対象領地<select id="fld_land">${opts(ls,x=>x.id,x=>x.name+'領（兵'+x.soldiers+'）')}</select></label>`;const targetSel=(fs)=>`<label>対象勢力<select id="fld_target">${opts(fs,x=>x.id,x=>x.name+'家 '+(neighbors(state.player).some(n=>n.id===x.id)?'🟢隣接':'⚪非隣接')+' / '+x.territories.length+'領')}</select></label>`;const gold=(values)=>`<label>使用する資金<select id="fld_gold">${values.map(v=>`<option value="${v}">${v}金</option>`).join('')}</select></label>`;let html='';if(type==='内政')html=landSel(my)+'<p class="muted">収入：政治力×ランダム4〜8。能吏で+15%。</p>';if(type==='登用')html=`<label>登用候補（最大1人）<select id="fld_officer">${opts(state.candidates.map(i=>state.officers[i]).filter(o=>o.owner===-1),x=>x.id,x=>x.name+' / 能力合計'+x.stats.reduce((a,b)=>a+b,0)+' / '+x.trait)}</select></label>`+gold([100,300,500,1000]);if(type==='募兵')html=landSel(my)+gold([100,200,500,1000]);if(type==='偵察'||type==='焼き討ち')html=landSel(enemy);if(type==='調略')html=`<label>敵家臣<select id="fld_officer">${opts(state.officers.filter(o=>o.owner!==-1&&o.owner!==state.player),x=>x.id,x=>x.name+'（'+faction(x.owner).name+'家 / 忠誠'+x.loyalty+'）')}</select></label>`;if(type==='同盟申請')html=targetSel(state.factions.filter(f=>f.id!==state.player&&!allied(state.player,f.id)&&f.territories.length>0&&allies(f.id).length<2).sort((a,b)=>Number(neighbors(state.player).some(n=>n.id===b.id))-Number(neighbors(state.player).some(n=>n.id===a.id))))+gold([100,300,500,1000,2000]);if(type==='援軍設定')html=targetSel(allies(state.player).map(a=>faction(a.id)))+`<label>援軍割合<select id="fld_percent">${[0,10,20,30,40,50].map(n=>`<option value="${n}">${n}%</option>`).join('')}</select></label>`;if(type==='戦争'||type==='裏切り侵攻'){const ls=adj.filter(l=>type==='裏切り侵攻'?allied(state.player,l.owner):!allied(state.player,l.owner));html=landSel(ls)+`<p class="muted">敵兵力は偵察済みの場合のみ表示：${ls.map(l=>esc(l.name)+': '+(state.scouts[l.id]&&state.scouts[l.id].until>=state.turn?state.scouts[l.id].soldiers+'人':'不明')).join(' / ')||'攻撃可能な領地なし'}</p><label>出陣兵士数<input id="fld_soldiers" type="number" min="100" step="100" value="1000"></label><p class="muted">出陣元：保有領地のうち対象に隣接する最多兵力の領地（自動）</p>`}if(type==='褒美')html=`<label>対象家臣<select id="fld_officer">${opts(myofficers(),x=>x.id,x=>x.name+'（忠誠'+x.loyalty+'）')}</select></label>`+gold([100,300,500]);el.innerHTML=html||'<p class="warn">選択できる対象がありません。</p>'}
function commitOrder(){const type=document.getElementById('cmdType')?.value;if(!type)return;const o={type};for(const k of ['land','target','officer','gold','soldiers','percent']){const e=document.getElementById('fld_'+k);if(e){if(!e.value){toast('対象を選択してください');return}o[k]=+e.value}}if(['内政','募兵','偵察','焼き討ち','戦争','裏切り侵攻'].includes(type)&&o.land===undefined){toast('対象領地がありません');return}if(['同盟申請','援軍設定'].includes(type)&&o.target===undefined){toast('対象勢力がありません');return}if(['登用','調略','褒美'].includes(type)&&o.officer===undefined){toast('対象武将がいません');return}if(o.soldiers!==undefined&&o.soldiers<100){toast('出陣は100人以上を指定してください');return}if(editing>=0)state.orders[editing]=o;else state.orders.push(o);editing=-1;save();render();toast('命令を保存しました')}
function deleteOrder(i){state.orders.splice(i,1);editing=-1;save();render()}function clearOrders(){if(confirm('予約中の命令をすべて削除しますか？')){state.orders=[];editing=-1;save();render()}}
function landsUI(){return `<div class="card"><h2>🗺️ 15か国の勢力図（一覧）</h2><p class="muted">隣接・同盟の情報は自国から見た状態。地理的隣接は固定です。</p>${state.lands.map(l=>{const f=faction(l.owner),mineLand=l.owner===state.player,adjacent=mylands().some(x=>adjacency(x.id,l.id)),al=allied(state.player,l.owner);return `<div class="item"><b>${esc(l.name)}領</b>　${esc(f.name)}家 ${mineLand?'<span class="badge">🟢自国</span>':''}${al?'<span class="badge">🔵同盟</span>':''}${adjacent&&!mineLand?'<span class="badge">🟡隣接</span>':''}${!mineLand&&!adjacent&&!al?'<span class="badge">⚪その他</span>':''}<br><small>領主：${esc(f.daimyo)} / 兵力：${mineLand||state.scouts[l.id]?.until>=state.turn?l.soldiers+'人':'未偵察'} / 隣接領：${state.lands.filter(x=>adjacency(l.id,x.id)).map(x=>esc(x.name)).join('・')}</small></div>`}).join('')}</div>`}
function officersUI(){return `<div class="card"><h2>👤 家臣（${myofficers().length}人・上限なし）</h2>${myofficers().map(o=>`<div class="item"><b>${esc(o.name)}</b> <span class="badge">${esc(o.trait)}</span><br><small>統率${o.stats[0]} 武力${o.stats[1]} 知略${o.stats[2]} 政治${o.stats[3]} / 忠誠${o.loyalty}</small></div>`).join('')||'家臣なし'}</div><div class="card"><h2>🧑‍🌾 今ターンの登用候補（12人）</h2>${state.candidates.map(i=>state.officers[i]).filter(o=>o.owner===-1).map(o=>`<div class="item">${esc(o.name)}　${esc(o.trait)}<br><small>統率${o.stats[0]} 武力${o.stats[1]} 知略${o.stats[2]} 政治${o.stats[3]}</small></div>`).join('')}</div>`}
function diplomacyUI(){const ns=new Set(neighbors(state.player).map(f=>f.id));const fs=state.factions.filter(f=>f.id!==state.player&&f.territories.length>0).sort((a,b)=>Number(ns.has(b.id))-Number(ns.has(a.id)));return `<div class="card"><h2>🤝 外交・同盟一覧</h2><p>現在の同盟：${allies(state.player).length}/2　｜　同盟は6ターン有効</p><p class="muted">隣接国を上に表示。非隣接国にも申請できます。</p>${fs.map(f=>`<div class="item"><b>${esc(f.name)}家</b> ${ns.has(f.id)?'<span class="badge">🟢隣接</span>':'<span class="badge">⚪非隣接</span>'} ${allied(state.player,f.id)?'<span class="badge">🤝同盟中</span>':''}<br><small>${f.territories.length}領 / ${esc(f.daimyo)} ${allied(state.player,f.id)?'/ 残り'+Math.max(0,allies(state.player).find(a=>a.id===f.id).until-state.turn+1)+'ターン':''}</small></div>`).join('')}<button onclick="tab='命令';editing=-1;render();document.getElementById('cmdType').value='同盟申請';renderFields()">同盟申請の命令へ</button></div>${state.offers.filter(o=>o.to===state.player&&o.until>=state.turn).map(o=>`<div class="card"><h2>📩 同盟申請が届いています</h2><p>${esc(faction(o.from).name)}家から${o.gold}金の申し出</p><button onclick="respondOffer(${o.from},true)">承認</button> <button class="secondary" onclick="respondOffer(${o.from},false)">拒否</button></div>`).join('')}`}
function logsUI(){return `<div class="card"><h2>📜 天下の出来事</h2>${state.logs.map(x=>`<div class="item">${esc(x)}</div>`).join('')}</div>`}
function helpUI(){return `<div class="card"><h2>📖 初心者向け説明書</h2><p>15か国のうち1国の大名となり、内政で資金を増やし、登用で家臣を集め、募兵で兵力を整え、戦争で天下統一を目指します。</p><h3>まずは3つの命令</h3><p>「命令」から内政・登用・募兵を1件ずつ追加し、「ホーム」の「次のターンへ」で実行。命令は個別に変更・削除できます。</p><h3>ターン</h3><p>本来は朝9時・夜21時の2回更新ですが、このソロ試作版では手動更新。60ターンまで遊べます。</p><h3>策略</h3><p>偵察で敵兵数を4ターン把握。調略は忠誠51以上なら成功時10〜20低下、50以下なら引き抜き。焼き討ちは敵兵を減らします。</p><h3>外交</h3><p>同盟は最大2勢力・6ターン。申請時に提示金が必要で、拒否なら返金。防衛援軍は0〜50%で設定できます。</p><h3>戦争</h3><p>隣接する敵領地に出陣。兵数、武将能力、天候、運で勝敗が変わります。1領地の兵士上限は15,000人です。</p><h3>セーブ</h3><p>この端末のブラウザに自動保存されます。Safariの履歴・サイトデータを消すと失われる場合があります。</p><button class="danger" onclick="if(confirm('現在のゲームを削除して最初から始めますか？')){localStorage.removeItem(SAVE);state=null;editing=-1;render()}">最初からやり直す</button></div>`}
function addAlly(i,j){if(allied(i,j)||allies(i).length>=2||allies(j).length>=2)return false;const until=state.turn+5;faction(i).allies.push({id:j,until,percent:0});faction(j).allies.push({id:i,until,percent:0});log(`${faction(i).name}家と${faction(j).name}家が同盟を締結（6ターン）`);return true}
function respondOffer(from,accept){const o=state.offers.find(x=>x.from===from&&x.to===state.player);if(!o)return;state.offers=state.offers.filter(x=>x!==o);if(accept&&addAlly(from,state.player)){mine().gold+=o.gold;log(`${faction(from).name}家からの同盟申請を承認（${o.gold}金を受領）`)}else{faction(from).gold+=o.gold;log(`${faction(from).name}家からの同盟申請を拒否`)}save();render()}
function allianceChance(i,j,gold){let chance=({100:10,300:20,500:35,1000:50,2000:80})[gold]||10;chance+=power(i)>power(j)?10:power(i)<power(j)?-10:0;if(faction(i).loyaltyPenalty>state.turn)chance-=30;return Math.max(5,Math.min(85,chance))}
function applyOrder(o,actor){const f=faction(actor),my=state.lands.filter(l=>l.owner===actor);const ownLand=id=>state.lands[id]&&state.lands[id].owner===actor;const cost=n=>{if(f.gold<n){if(actor===state.player)log('資金不足で'+o.type+'は失敗');return false}f.gold-=n;return true};let l=state.lands[o.land];switch(o.type){case '内政':{if(!ownLand(o.land))break;let amount=politics(actor,l)*rand(4,8);if(hasTrait(actor,'能吏'))amount=Math.floor(amount*1.15);f.gold+=amount;if(actor===state.player)log(`${l.name}領の内政で${amount}金を獲得`);break}case '募兵':{if(!ownLand(o.land)||!cost(o.gold))break;let n=Math.floor(o.gold*1.5);const p=politics(actor,l);n=Math.floor(n*(1+(p<100?0:Math.min(10,Math.floor((p-100)/20)*2+2))/100));if(hasTrait(actor,'募兵'))n=Math.floor(n*1.1);const gained=Math.min(n,15000-l.soldiers);l.soldiers+=gained;if(actor===state.player)log(`${l.name}領で${gained}人を募兵`);break}case '登用':{const x=state.officers[o.officer];if(!x||x.owner!==-1||!cost(o.gold))break;const chance=Math.min(90,Math.max(10,45+Math.floor((ability(actor,my[0],2)-100)/8)+({100:10,300:18,500:25,1000:35}[o.gold]||0)));if(rand(1,100)<=chance){x.owner=actor;x.loyalty=rand(75,95);if(actor===state.player)log(`${x.name}の登用に成功！`)}else if(actor===state.player)log(`${x.name}の登用に失敗`);break}case '偵察':{if(!l||l.owner===actor)break;const success=rand(1,100)<=Math.min(95,60+Math.floor((ability(actor,my[0],2)-100)/4));if(success){state.scouts[o.land]={soldiers:l.soldiers,until:state.turn+3};if(actor===state.player)log(`${l.name}領の偵察に成功（兵士${l.soldiers}人）`)}else if(actor===state.player)log(`${l.name}領の偵察に失敗`);break}case '調略':{const x=state.officers[o.officer];if(!x||x.owner<0||x.owner===actor)break;let chance=Math.min(90,Math.max(15,40+Math.floor((ability(actor,my[0],2)-100)/3)+(hasTrait(actor,'軍師')?10:0)));if(rand(1,100)<=chance){if(x.loyalty<=50){const old=x.owner;x.owner=actor;x.loyalty=rand(60,80);log(`${x.name}が${faction(old).name}家から${f.name}家へ寝返った`)}else{const n=rand(10,20);x.loyalty=Math.max(0,x.loyalty-n);if(actor===state.player)log(`${x.name}の忠誠を${n}低下させた`)}}else if(actor===state.player)log(`${x.name}への調略は失敗`);break}case '焼き討ち':{if(!l||l.owner===actor)break;const chance=50+(hasTrait(actor,'軍師')?10:0);if(rand(1,100)<=chance){const n=Math.min(l.soldiers,rand(200,600));l.soldiers-=n;if(actor===state.player)log(`${l.name}領への焼き討ち成功、敵兵${n}人減少`)}else if(actor===state.player)log('焼き討ちは失敗');break}case '同盟申請':{const j=o.target;if(j===actor||allied(actor,j)||allies(actor).length>=2||allies(j).length>=2||!cost(o.gold))break;if(j===state.player&&actor!==state.player){state.offers.push({from:actor,to:j,gold:o.gold,until:state.turn+1});log(`${f.name}家から同盟申請（提示金${o.gold}）`)}else if(rand(1,100)<=allianceChance(actor,j,o.gold)){if(addAlly(actor,j))faction(j).gold+=o.gold;else f.gold+=o.gold}else{f.gold+=o.gold;if(actor===state.player)log(`${faction(j).name}家に同盟を拒否されました`)}break}case '援軍設定':{const a=f.allies.find(x=>x.id===o.target&&x.until>=state.turn);if(a){a.percent=o.percent;if(actor===state.player)log(`${faction(o.target).name}家への援軍を${o.percent}%に設定`)}break}case '褒美':{const x=state.officers[o.officer];if(!x||x.owner!==actor||!cost(o.gold))break;x.loyalty=Math.min(100,x.loyalty+({100:15,300:40,500:60}[o.gold]||0));if(actor===state.player)log(`${x.name}に褒美、忠誠${x.loyalty}`);break}case '戦争':case '裏切り侵攻':{if(!l||l.owner===actor)return;const from=my.filter(x=>adjacency(x.id,l.id)).sort((a,b)=>b.soldiers-a.soldiers)[0];if(!from||from.soldiers<o.soldiers||o.soldiers<100)return;const victim=l.owner;if(o.type==='戦争'&&allied(actor,victim))return;if(o.type==='裏切り侵攻'){if(!allied(actor,victim))return;f.allies=f.allies.filter(a=>a.id!==victim);faction(victim).allies=faction(victim).allies.filter(a=>a.id!==actor);f.loyaltyPenalty=state.turn+12;state.officers.filter(x=>x.owner===actor).forEach(x=>x.loyalty=Math.max(0,x.loyalty-20));log(`${f.name}家が${faction(victim).name}家との同盟を裏切った！`)}const troop=Math.min(from.soldiers,o.soldiers);const weather=pick([1,1,1,.95,.9,.85]);const atk=(troop/80+ability(actor,from,1)*.4+ability(actor,from,0)*.2+ability(actor,from,2)*.2)*(hasTrait(actor,'猛将')?1.1:1)*weather*rand(90,110)/100;let reinforcements=0;const sent=[];for(const a of allies(victim)){const ally=faction(a.id);const own=state.lands.filter(x=>x.owner===ally.id).sort((a,b)=>b.soldiers-a.soldiers)[0];const reciprocal=ally.allies.find(x=>x.id===victim);if(own&&reciprocal){const n=Math.floor(own.soldiers*reciprocal.percent/100);if(n>0){own.soldiers-=n;reinforcements+=n;sent.push({land:own,n,owner:ally.id})}}}const def=( (l.soldiers+reinforcements)/90+ability(victim,l,0)*.4+ability(victim,l,2)*.3+ability(victim,l,1)*.1)*(hasTrait(victim,'守将')?1.1:1)*(hasTrait(victim,'築城')?1.05:1)*rand(90,110)/100;from.soldiers-=troop;const won=atk>def;const attackerLoss=Math.floor(troop*(won?rand(15,35):rand(40,70))/100);const defenderLoss=Math.floor((l.soldiers+reinforcements)*(won?rand(35,65):rand(15,35))/100);const defendBase=l.soldiers+reinforcements;const ownLoss=Math.min(l.soldiers,Math.round(defenderLoss*l.soldiers/Math.max(1,defendBase)));l.soldiers-=ownLoss;for(const s of sent){const loss=Math.min(s.n,Math.round(defenderLoss*s.n/Math.max(1,defendBase)));s.land.soldiers=Math.min(15000,s.land.soldiers+s.n-loss)}if(won){l.owner=actor;l.soldiers=Math.min(15000,Math.floor((troop-attackerLoss)*.7));from.soldiers=Math.min(15000,from.soldiers+Math.floor((troop-attackerLoss)*.3));log(`${f.name}家が${faction(victim).name}家の${l.name}領を攻略！${sent.length?' 援軍'+reinforcements+'人':''}`)}else{from.soldiers=Math.min(15000,from.soldiers+troop-attackerLoss);log(`${f.name}家が${l.name}領に侵攻するも敗北${sent.length?'（援軍'+reinforcements+'人）':''}`)}break}}}
function npcAction(i){const f=faction(i);if(!f.territories.length)return;const ls=state.lands.filter(l=>l.owner===i);const enemy=state.lands.filter(l=>l.owner!==i&&ls.some(x=>adjacency(x.id,l.id))&&!allied(i,l.owner));const candidates=state.officers.filter(o=>o.owner===-1);const actions=['内政','登用','募兵','調略','戦争'];const weights=WEIGHTS[PERSONAL.indexOf(f.personality)];for(let attempt=0;attempt<5;attempt++){let n=rand(1,100),t='内政';for(let k=0;k<actions.length;k++){n-=weights[k];if(n<=0){t=actions[k];break}}let o={type:t,land:pick(ls).id};if(t==='登用'){if(!candidates.length||f.gold<100)continue;o.officer=pick(candidates).id;o.gold=pick([100,300,500])}if(t==='募兵'){if(f.gold<100)continue;o.gold=pick([100,200,500]);if(o.gold>f.gold)o.gold=100}if(t==='調略'){const e=state.officers.filter(x=>x.owner>=0&&x.owner!==i);if(!e.length)continue;o.officer=pick(e).id}if(t==='戦争'){if(!enemy.length)continue;o.land=pick(enemy).id;const from=ls.filter(x=>adjacency(x.id,o.land)).sort((a,b)=>b.soldiers-a.soldiers)[0];if(!from||from.soldiers<1500)continue;o.soldiers=Math.floor(from.soldiers*.65)}applyOrder(o,i);return}applyOrder({type:'内政',land:ls[0].id},i)}
function npcDiplomacy(i){const f=faction(i);if(!f.territories.length||allies(i).length>=2)return;if(rand(1,100)>(allies(i).length===0?8:5))return;const adjacent=neighbors(i).filter(x=>!allied(i,x.id)&&allies(x.id).length<2);const pool=adjacent.length?adjacent:state.factions.filter(x=>x.id!==i&&x.territories.length&&!allied(i,x.id)&&allies(x.id).length<2);if(!pool.length)return;const target=pick(pool);const gold=pick([100,100,100,100,100,100,100,300,300,300,300,300,500,500,500,500,500,1000,1000,2000]);if(f.gold<gold)return;applyOrder({type:'同盟申請',target:target.id,gold},i)}
function nextTurn(){if(state.over)return;if(!confirm(`第${state.turn}ターンの命令${state.orders.length}件を実行して次へ進みますか？`))return;const orders=[...state.orders];state.orders=[];editing=-1;for(const o of orders)applyOrder(o,state.player);for(let i=0;i<15;i++)if(i!==state.player)npcAction(i);for(let i=0;i<15;i++)if(i!==state.player)npcDiplomacy(i);for(const o of state.officers)if(o.owner>=0)o.loyalty=Math.max(0,Math.min(100,o.loyalty-rand(0,5)+(o.trait==='人望'?1:0)));for(const f of state.factions)f.territories=state.lands.filter(l=>l.owner===f.id).map(l=>l.id);state.turn++;for(const f of state.factions)f.allies=f.allies.filter(a=>{if(a.until<state.turn){if(f.id< a.id)log(`${f.name}家と${faction(a.id).name}家の同盟が終了`);return false}return true});for(const o of state.offers.filter(x=>x.until<state.turn)){faction(o.from).gold+=o.gold;log(`${faction(o.from).name}家からの同盟申請が期限切れ`)}state.offers=state.offers.filter(x=>x.until>=state.turn);refreshCandidates();if(mylands().length===15){state.over=true;log('🎉 天下統一！ おめでとう！')}else if(!mylands().length){state.over=true;log('あなたの勢力は滅亡しました')}else if(state.turn>60){state.over=true;log('60ターン終了！ 最終領地数：'+mylands().length)}save();tab='ホーム';render();toast('ターンを更新しました')}
if(!load())state=null;render();if(state&&tab==='命令')renderFields();
// 命令画面が描画されるたび、動的フォームを初期化
const oldRender=render;render=function(){oldRender();if(state&&tab==='命令')renderFields()};
</script></body></html>
